<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotización | TornoAuto</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--n:#1a3057;--r:#c8102e;--nl:#edf1f7;--m:#7a8899;--b:#dde3ec}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,system-ui,'Segoe UI',sans-serif;background:#e5ddd5;display:flex;flex-direction:column;align-items:center;padding:24px;gap:20px}
  .loader{border:4px solid #f3f4f6;border-top:4px solid var(--n);border-radius:50%;width:44px;height:44px;animation:spin .8s linear infinite;margin:40px auto}
  @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  .msg-box{width:100%;max-width:750px;background:#fff;border-radius:16px;padding:50px;box-shadow:0 2px 16px rgba(0,0,0,.1);text-align:center}
  .msg-box p{font-size:17px;color:var(--m)}
  .msg-error{color:var(--r)!important;font-weight:700;font-size:23px!important}
  .c{width:100%;max-width:750px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.12);display:none}
  .hd{background:#fff;padding:24px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--n)}
  .lg-img{height:75px;width:auto;display:block}
  .cn{text-align:right;color:var(--n)}
  .cn small{font-size:14px;text-transform:uppercase;letter-spacing:2px;opacity:.6;color:var(--m)}
  .cn strong{font-size:44px;font-weight:900;display:block;line-height:1.1;color:var(--r)}
  .cl{display:flex;background:var(--n);border-bottom:1px solid var(--b)}
  .cl div{flex:1;padding:18px 32px;min-width:0}
  .cl div:first-child{border-right:1px solid #33507f}
  .cl span{display:block;font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:#8fa3c4;font-weight:700;margin-bottom:6px}
  .cl strong{font-size:24px;color:#fff;overflow-wrap:anywhere}
  .bar{padding:20px 32px 0;display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;align-items:center}
  .pbtn{border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:700;padding:12px 20px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .pbtn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .pbtn:active{transform:scale(.97)}
  .pbtn-toggle{background:var(--n)}
  .pbtn-toggle.off{background:var(--r)}
  .pbtn-carta{background:#065f46}
  .pbtn-ticket{background:#7c3aed}
  .pbtn-img{background:#b45309}
  .sel-filtro{border:2px solid var(--b);border-radius:8px;background:#f0f4f8;color:var(--n);font-size:15px;font-weight:700;padding:11px 16px;cursor:pointer;outline:none;transition:all .15s}
  .sel-filtro:focus{border-color:var(--n)}
  .bd{padding:16px 32px 24px}
  .s{margin-bottom:20px}
  .st{font-size:18px;text-transform:uppercase;letter-spacing:2px;color:var(--n);font-weight:800;padding-bottom:8px;border-bottom:3px solid var(--r);display:inline-block;margin-bottom:12px}
  .rw{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid #f0f1f4;gap:12px}
  .rw:last-of-type{border-bottom:none}
  .rn{font-size:21px;font-weight:700;color:#1e2a3a;flex:1;line-height:1.35;min-width:0;overflow-wrap:anywhere}
  .rd{font-size:17px;color:var(--m);line-height:1.3;margin-top:4px;overflow-wrap:anywhere}
  .rd b{color:var(--r);font-weight:800}
  .acts{margin-top:8px;padding:10px 14px;background:#f7f9fc;border-left:4px solid var(--n);border-radius:0 8px 8px 0}
  .act{display:flex;justify-content:flex-start;align-items:baseline;padding:4px 0;gap:12px}
  .act-n{font-size:17px;color:#1e2a3a;font-weight:600;overflow-wrap:anywhere}
  .act-m{font-size:16px;color:var(--r);font-weight:700;white-space:nowrap;background:#fff;padding:2px 10px;border-radius:4px;border:1px solid var(--b)}
  .rep{padding:12px 0;border-bottom:1px solid #f0f1f4}
  .rep:last-child{border-bottom:none}
  .rep-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .rep-nombre{font-size:20px;color:#1e2a3a;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
  .rep-nombre .qty{color:var(--r);margin-right:6px}
  .rep-total{font-size:19px;color:var(--n);font-weight:800;white-space:nowrap;transition:all .25s}
  .rep-total.hide{opacity:0;font-size:0}
  .rep-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .rep-tag{font-size:15px;font-weight:700;padding:3px 9px;border-radius:4px;background:var(--nl);color:var(--n);white-space:normal;overflow-wrap:anywhere;max-width:100%;border:1px solid var(--b)}
  .rep-tag b{color:var(--m);font-weight:600;margin-right:6px;text-transform:uppercase;font-size:12px;letter-spacing:.5px}
  .rep-coment{font-size:16px;color:var(--m);font-style:italic;margin-top:6px;overflow-wrap:anywhere}
  .rp{font-size:20px;color:var(--n);font-weight:800;white-space:nowrap;text-align:right;min-width:100px;transition:all .25s}
  .rp.hide{opacity:0;font-size:0;min-width:0;overflow:hidden}
  .sb{display:flex;justify-content:flex-end;align-items:center;padding:10px 14px;margin-top:10px;background:#e4eaf4;border-top:2px solid var(--n);border-bottom:2px solid var(--n);gap:12px}
  .sb small{font-size:17px;color:var(--n);text-transform:uppercase;letter-spacing:.5px}
  .sb strong{font-size:23px;color:var(--n)}
  .sb.rect small{color:var(--n);font-weight:700}
  .tb{background:var(--n);border-radius:12px;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;margin:20px 0}
  .tb span{font-size:42px;color:#fff;letter-spacing:1px;font-weight:900}
  .tb strong{font-size:42px;font-weight:900;color:#fff;letter-spacing:-.5px}
  .tb strong small{font-size:24px;font-weight:600;opacity:.5;margin-right:6px}
  .nt{padding:16px 22px;background:#fdf0f2;border-left:5px solid var(--r);border-radius:0 10px 10px 0;font-size:18px;color:#1e2a3a;line-height:1.4}
  .nt b{color:var(--r)}
  .ft{background:var(--nl);padding:16px;text-align:center;font-size:15px;color:var(--m)}
  @media(max-width:480px){
    body{padding:12px}
    .hd{padding:16px 20px}
    .lg-img{height:55px}
    .cn strong{font-size:32px}
    .cl div{padding:12px 20px}
    .cl strong{font-size:18px}
    .bar{padding:14px 20px 0;gap:8px}
    .pbtn{font-size:13px;padding:10px 14px}
    .bd{padding:12px 20px 20px}
    .rn{font-size:18px}
    .rep-nombre{font-size:18px}
    .rp{font-size:17px;min-width:80px}
    .tb span{font-size:28px}
    .tb strong{font-size:28px}
  }
</style>
</head>
<body>

<div class="msg-box" id="msgBox">
  <div class="loader"></div>
  <p>Cargando cotización...</p>
</div>

<div class="c" id="cotCard">
  <div class="hd">
    <img src="https://res.cloudinary.com/djtjnoajc/image/upload/v1778773818/tornoauto-imagotipo-_-slogan-full-color-rgb-900px-w-72ppi_ovzkdr.png" alt="TornoAuto" class="lg-img" id="logoImg" crossorigin="anonymous">
    <div class="cn"><small id="tituloDocumento">Cotización</small><strong id="cotFolio">#---</strong></div>
  </div>
  <div class="cl">
    <div><span>Cliente</span><strong id="cotCliente">-</strong></div>
    <div><span>Motor</span><strong id="cotMotor">-</strong></div>
  </div>
  <div class="bar">
    <button class="pbtn" id="btnTipoDoc" onclick="toggleTipoDocumento()" style="background:#475569;">📄 Cotización</button>

    <select id="selFiltro" class="sel-filtro">
      <option value="todo">📋 Todo</option>
      <option value="mo">🔧 Solo mano de obra</option>
      <option value="rep">🔩 Solo repuestos</option>
    </select>
    <button class="pbtn pbtn-toggle" id="btnPrecios" onclick="togglePrecios()">🙈 Ocultar precios</button>
    <button class="pbtn pbtn-carta" onclick="descargarPDF('carta')">📄 PDF Carta</button>
    <button class="pbtn pbtn-ticket" onclick="descargarPDF('ticket')">🧾 PDF Ticket</button>
    <button class="pbtn pbtn-img" onclick="descargarImagen()">🖼 Imagen</button>
  </div>
  <div class="bd" id="cotBody"></div>
  <div class="ft" id="footerDocumento">Cotización válida por 15 días · TornoAuto</div>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbz1GkMSXIUofVKdbfxAA_N00kU9nngJ1k6g9NjyO5XSpZkztCLAM7YIRnvGA-w3k_B2/exec';

var cotData=null,preciosVisibles=true,tipoDocumento='Cotizacion',LOGO_URL='https://res.cloudinary.com/djtjnoajc/image/upload/v1778773818/tornoauto-imagotipo-_-slogan-full-color-rgb-900px-w-72ppi_ovzkdr.png',LOGO_DATA=null,LOGO_W=900,LOGO_H=200;

function getFolio(){
  var p=new URLSearchParams(window.location.search);
  return p.get('folio')||p.get('f')||'';
}

function precargarLogo(cb){
  if(LOGO_DATA){cb();return}
  var img=new Image();img.crossOrigin='anonymous';
  img.onload=function(){
    LOGO_W=img.naturalWidth;LOGO_H=img.naturalHeight;
    var cv=document.createElement('canvas');cv.width=LOGO_W;cv.height=LOGO_H;
    cv.getContext('2d').drawImage(img,0,0);
    try{LOGO_DATA=cv.toDataURL('image/png')}catch(e){LOGO_DATA=null}
    cb();
  };
  img.onerror=function(){cb()};
  img.src=LOGO_URL;
}

window.onload=function(){
  precargarLogo(function(){});
  var folio=getFolio();
  if(!folio){
    document.getElementById('msgBox').innerHTML='<p class="msg-error">❌ No se proporcionó folio</p><p style="margin-top:10px;font-size:13px">Usa: ?folio=XXXXXX</p>';
    return;
  }
  fetch(API_URL+'?folio='+encodeURIComponent(folio))
    .then(function(r){return r.json()})
    .then(function(r){
      document.getElementById('msgBox').style.display='none';
      if(r.success){cotData=ordenarCotizacion(r.cotizacion);renderCotizacion(cotFiltrada())}
      else{
        document.getElementById('msgBox').style.display='block';
        document.getElementById('msgBox').innerHTML='<p class="msg-error">❌ '+(r.error||'Error desconocido')+'</p>';
      }
    })
    .catch(function(err){
      document.getElementById('msgBox').innerHTML='<p class="msg-error">❌ '+err.message+'</p>';
    });
};

function toggleTipoDocumento(){
  var btn = document.getElementById('btnTipoDoc');
  var titulo = document.getElementById('tituloDocumento');
  var footer = document.getElementById('footerDocumento');
  
  if(tipoDocumento === 'Cotizacion'){
    tipoDocumento = 'Comprobante';
    if(btn) btn.innerHTML = '🧾 Comprobante';
    if(titulo) titulo.textContent = 'Comprobante';
    if(footer) footer.textContent = 'Comprobante generado · TornoAuto';
    document.title = 'Comprobante | TornoAuto';
  } else {
    tipoDocumento = 'Cotizacion';
    if(btn) btn.innerHTML = '📄 Cotización';
    if(titulo) titulo.textContent = 'Cotización';
    if(footer) footer.textContent = 'Cotización válida por 15 días · TornoAuto';
    document.title = 'Cotización | TornoAuto';
  }
  if(cotData)renderCotizacion(cotFiltrada());
}

function textoDocumentoMayus(){
  return tipoDocumento === 'Cotizacion' ? 'COTIZACIÓN' : 'COMPROBANTE';
}

function fmt(n){return 'Q '+n.toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2})}

function numOrden(v,fallback){
  var n=parseFloat(String(v===null||v===undefined?'':v).replace(',','.'));
  return isNaN(n)?fallback:n;
}

function esSeccionRectificado(s){
  if(!s || s.tipo!=='manoObra')return false;
  var t=(s.titulo||'').toLowerCase();
  return /cig[uü]|block|biela|culata/.test(t);
}

function analizarGrupo(secciones){
  var flags=[],suma=0,lastIdx=-1;
  (secciones||[]).forEach(function(s,i){
    var g=esSeccionRectificado(s);
    flags.push(g);
    if(g){suma+=(s.subtotal||0);lastIdx=i;}
  });
  return {flags:flags,suma:Math.round(suma*100)/100,lastIdx:lastIdx};
}

function ordenarCotizacion(c){
  if(!c || !Array.isArray(c.secciones))return c;

  var copia=Object.assign({},c);
  copia.secciones=c.secciones.slice().sort(function(a,b){
    var oa=numOrden(a.ordenCategoria,9999);
    var ob=numOrden(b.ordenCategoria,9999);
    if(oa!==ob)return oa-ob;
    return String(a.titulo||'').localeCompare(String(b.titulo||''));
  }).map(function(sec){
    var secCopia=Object.assign({},sec);
    if(Array.isArray(secCopia.items)){
      secCopia.items=secCopia.items.slice().sort(function(a,b){
        var oa=numOrden(a.orden,numOrden(a.ordenTarifa,9999));
        var ob=numOrden(b.orden,numOrden(b.ordenTarifa,9999));
        if(oa!==ob)return oa-ob;
        var na=String(a.nombre||a.repuesto||a.nr||'');
        var nb=String(b.nombre||b.repuesto||b.nr||'');
        return na.localeCompare(nb);
      });
    }
    return secCopia;
  });

  return copia;
}


function cotFiltrada(){
  if(!cotData)return null;
  var filtro=document.getElementById('selFiltro').value;
  var base=ordenarCotizacion(cotData);
  if(filtro==='todo')return base;
  var secs=base.secciones.filter(function(s){
    if(filtro==='mo')return s.tipo==='manoObra';
    if(filtro==='rep')return s.tipo==='repuestos';
    return true;
  });
  var total=secs.reduce(function(a,s){return a+s.subtotal},0);
  return Object.assign({},cotData,{secciones:secs,total:Math.round(total*100)/100});
}

function renderCotizacion(c){
  document.getElementById('cotFolio').textContent='#'+c.folio;
  document.getElementById('cotCliente').textContent=c.cliente||'-';
  document.getElementById('cotMotor').textContent=c.motor||'-';
  var grupo=analizarGrupo(c.secciones);
  var h='';
  c.secciones.forEach(function(sec,i){
    h+='<div class="s"><div class="st">'+sec.titulo+'</div>';
    if(sec.tipo==='repuestos'){
      sec.items.forEach(function(r){
        h+='<div class="rep"><div class="rep-hd">'
          +'<span class="rep-nombre">'+((r.cantidad||1)>1?'<span class="qty">'+r.cantidad+'×</span> ':'')+(r.repuesto||r.nr||'-')+'</span>'
          +'<span class="rep-total precio">'+fmt(r.total||0)+'</span>'
          +'</div>';
        var tags='';
        if(r.medida)tags+='<span class="rep-tag"><b>Medida</b>'+r.medida+'</span>';
        if(r.escadm)tags+='<span class="rep-tag"><b>ESC/ADM</b>'+r.escadm+'</span>';
        if(r.presentacion)tags+='<span class="rep-tag"><b>Pres.</b>'+r.presentacion+'</span>';
        if(r.contiene)tags+='<span class="rep-tag"><b>Contiene</b>'+r.contiene+'</span>';
        if(r.marca && r.marca!=='---')tags+='<span class="rep-tag"><b>Marca</b>'+r.marca+'</span>';
        if(r.nr && r.nr!==r.repuesto)tags+='<span class="rep-tag"><b>NR</b>'+r.nr+'</span>';
        if(tags)h+='<div class="rep-tags">'+tags+'</div>';
        if(r.comentario)h+='<div class="rep-coment">Nota: '+r.comentario+'</div>';
        h+='</div>';
      });
    }else{
      sec.items.forEach(function(item){
        h+='<div class="rw"><div class="rn">'+item.nombre;
        if(item.comentario || item.manejaCantidad){
          h+='<div class="rd">'+(item.manejaCantidad?'<b>'+(item.cantidad||1)+'×</b> ':'')+(item.comentario||'')+'</div>';
        }
        if(item.actividades && item.actividades.length>0){
          h+='<div class="acts">';
          item.actividades.forEach(function(a){
            h+='<div class="act"><span class="act-n">'+(a.actividad||'-')+'</span>';
            if(a.medida)h+='<span class="act-m">'+a.medida+'</span>';
            h+='</div>';
          });
          h+='</div>';
        }
        h+='</div><span class="rp precio">'+fmt(item.precio)+'</span></div>';
      });
    }
  if(grupo.flags[i]){
      if(i===grupo.lastIdx){
h+='<div class="sb"><small>Subtotal Mano de Obra</small><strong>'+fmt(grupo.suma)+'</strong></div>';
      }
    }else{
      h+='<div class="sb"><small>'+(sec.tipo==='repuestos'?'Subtotal Repuestos':'Subtotal')+'</small><strong>'+fmt(sec.subtotal)+'</strong></div>';
    }
    h+='</div>';
  });
  h+='<div class="tb"><span>TOTAL</span><strong><small>Q</small> '+c.total.toLocaleString('es-GT',{minimumFractionDigits:2})+'</strong></div>';
  if(tipoDocumento==='Cotizacion'){
    h+='<div class="nt"><b>⚠ Anticipo:</b> Se requiere 50% del total para iniciar trabajo.</div>';
  }
  document.getElementById('cotBody').innerHTML=h;
  document.getElementById('cotCard').style.display='block';
}

document.getElementById('selFiltro').addEventListener('change',function(){
  if(cotData)renderCotizacion(cotFiltrada());
});

function togglePrecios(){
  preciosVisibles=!preciosVisibles;
  document.querySelectorAll('.precio').forEach(function(el){el.classList.toggle('hide',!preciosVisibles)});
  var b=document.getElementById('btnPrecios');
  b.innerHTML=preciosVisibles?'🙈 Ocultar precios':'👁 Mostrar precios';
  b.classList.toggle('off',!preciosVisibles);
}

function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}

function dibujarPDF(doc,W,c,mostrar,esCarta){
  var navy='#1a3057',red='#c8102e',bg='#edf1f7',gray='#7a8899',border='#dde3ec';
  var M=esCarta?20:6,y=0;
  var fs=esCarta?{h1:26,h2:22,h3:16,body:14,small:12,tiny:10,total:30,sub:13,act:12}:{h1:14,h2:12,h3:8,body:10,small:9,tiny:7.5,total:13,sub:10,act:6.5};
  var PADB=esCarta?7:4.5, LHD=esCarta?6:3.5;
  var grupo=analizarGrupo(c.secciones);
  function rgb(h){return hexRgb(h)}
  function fill(x,yy,w,h,col){var r=rgb(col);doc.setFillColor(r[0],r[1],r[2]);doc.rect(x,yy,w,h,'F')}
  function txt(t,x,yy,col,sz,bold,align){var r=rgb(col);doc.setTextColor(r[0],r[1],r[2]);doc.setFontSize(sz);doc.setFont('helvetica',bold?'bold':'normal');doc.text(t+'',x,yy,{align:align||'left'})}
  function ln(x1,y1,x2,y2,col,w){var r=rgb(col);doc.setDrawColor(r[0],r[1],r[2]);doc.setLineWidth(w||0.2);doc.line(x1,y1,x2,y2)}
  function wrapPDF(t,x,col,sz,bold,maxW,lh){
    doc.setFontSize(sz);doc.setFont('helvetica',bold?'bold':'normal');
    var lines=doc.splitTextToSize(t+'',maxW);
    lines.forEach(function(l){
      if(esCarta&&y>262){doc.addPage();y=20}
      txt(l,x,y+lh,col,sz,bold);
      y+=lh;
    });
  }
  var hdrH=esCarta?34:18;
  fill(0,y,W,hdrH,'#ffffff');ln(0,y+hdrH,W,y+hdrH,navy,esCarta?1:0.5);
  var logoH=esCarta?20:10;
  var logoW=LOGO_DATA?(LOGO_W/LOGO_H)*logoH:logoH*4;
  if(LOGO_DATA){try{doc.addImage(LOGO_DATA,'PNG',M,y+(hdrH-logoH)/2,logoW,logoH)}catch(e){txt('TornoAuto',M,y+(esCarta?19:11),navy,fs.h1,true)}}
  else{txt('TornoAuto',M,y+(esCarta?19:11),navy,fs.h1,true)}
  
  txt(textoDocumentoMayus(),W-M,y+(esCarta?12:7),gray,fs.tiny,false,'right');
  txt('#'+c.folio,W-M,y+(esCarta?26:14),red,fs.h2,true,'right');
  y+=hdrH;
  var infoH=esCarta?28:14;
  fill(0,y,W,infoH,bg);
  ln(0,y,W,y,navy,esCarta?0.6:0.3);
  ln(0,y+infoH,W,y+infoH,navy,esCarta?0.6:0.3);
  txt('CLIENTE',M,y+(esCarta?9:5),gray,fs.tiny,true);
  txt(c.cliente,M,y+(esCarta?20:11),navy,fs.body,true);
  ln(W/2,y+(esCarta?3:1.5),W/2,y+infoH-(esCarta?3:1.5),border);
  txt('MOTOR',W/2+(esCarta?10:4),y+(esCarta?9:5),gray,fs.tiny,true);
  doc.setFontSize(esCarta?fs.small:fs.tiny+1.5);doc.setFont('helvetica','bold');
  var motorLines=doc.splitTextToSize(c.motor,W/2-M-(esCarta?12:4));
  var nv=hexRgb(navy);
  doc.setTextColor(nv[0],nv[1],nv[2]);
  doc.text(motorLines,W/2+(esCarta?10:4),y+(esCarta?18:11));
  y+=infoH+(esCarta?6:3);
  c.secciones.forEach(function(sec,i){

function dibujarPDFCartaTabla(doc,c,mostrar){
  var navy=hexRgb('#1a3057'),red=hexRgb('#c8102e'),bgc=hexRgb('#edf1f7'),gry=hexRgb('#7a8899'),brd=hexRgb('#dde3ec'),drk=hexRgb('#1e2a3a'),blanco=[255,255,255];
  var subBg=hexRgb('#e4eaf4'),divCol=hexRgb('#e3e8f0'),divNavy=hexRgb('#33507f');
  var W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  var M=10,grupo=analizarGrupo(c.secciones);
  var wTabla=W-M*2;
  var wPre=mostrar?27:0;
  var wCon=(wTabla-wPre)*0.44,wDet=wTabla-wPre-wCon;
  var xCon=M,xDet=M+wCon,xPre=M+wCon+wDet;
  var GAP=4;

  function fill(x,yy,w,h,col){doc.setFillColor(col[0],col[1],col[2]);doc.rect(x,yy,w,h,'F')}
  function txt(t,x,yy,col,sz,bold,align){doc.setTextColor(col[0],col[1],col[2]);doc.setFontSize(sz);doc.setFont('helvetica',bold?'bold':'normal');doc.text(t+'',x,yy,{align:align||'left'})}
  function ln(x1,y1,x2,y2,col,w){doc.setDrawColor(col[0],col[1],col[2]);doc.setLineWidth(w||0.15);doc.line(x1,y1,x2,y2)}

  var rows=[];
  c.secciones.forEach(function(sec,i){
    if(sec.tipo==='repuestos')rows.push({t:'gap'});
    rows.push({t:sec.tipo==='repuestos'?'secnav':'sec',txt:sec.titulo.toUpperCase()});
    if(sec.tipo==='repuestos'){
      sec.items.forEach(function(r){
        var det=[];
        if(r.medida)det.push('Med: '+r.medida);
        if(r.escadm)det.push('ESC/ADM: '+r.escadm);
        if(r.presentacion)det.push('Pres: '+r.presentacion);
        if(r.contiene)det.push('Cont: '+r.contiene);
        if(r.marca && r.marca!=='---')det.push('Marca: '+r.marca);
        if(r.nr && r.nr!==r.repuesto)det.push('NR: '+r.nr);
        if(r.comentario)det.push('Nota: '+r.comentario);
        rows.push({t:'item',con:((r.cantidad||1)>1?r.cantidad+'× ':'')+(r.repuesto||r.nr||'-'),det:det.join(' · '),pre:fmt(r.total||0)});
      });
    }else{
      sec.items.forEach(function(item){
        var det=[];
        if(item.manejaCantidad)det.push((item.cantidad||1)+'×');
        if(item.comentario)det.push(item.comentario);
        (item.actividades||[]).forEach(function(a){det.push('• '+(a.actividad||'-')+(a.medida?' ['+a.medida+']':''))});
        rows.push({t:'item',con:item.nombre||'',det:det.join('   '),pre:fmt(item.precio)});
      });
    }
    if(grupo.flags[i]){
      if(i===grupo.lastIdx)rows.push({t:'sub',txt:'SUBTOTAL MANO DE OBRA',pre:fmt(grupo.suma)});
    }else{
      rows.push({t:'sub',txt:sec.tipo==='repuestos'?'SUBTOTAL REPUESTOS':'SUBTOTAL',pre:fmt(sec.subtotal)});
    }
  });

  var esCot=(tipoDocumento==='Cotizacion');
  var avail=H-20-19-7-16-(esCot?11:0)-8-4;
  var sizes=[
    {f:9,lh:4,pad:1.6,fd:7.5,lhd:3.3},
    {f:8.5,lh:3.7,pad:1.4,fd:7,lhd:3},
    {f:8,lh:3.4,pad:1.2,fd:6.5,lhd:2.8},
    {f:7.5,lh:3.1,pad:1,fd:6,lhd:2.6},
    {f:7,lh:2.9,pad:0.9,fd:5.8,lhd:2.4}
  ];
  var cfg=sizes[sizes.length-1];
  for(var s=0;s<sizes.length;s++){
    var z=sizes[s],tot=0;
    rows.forEach(function(r){
      if(r.t==='gap'){tot+=GAP;return}
      if(r.t==='sec'||r.t==='secnav'){tot+=z.lh+z.pad*2;return}
      if(r.t==='sub'){tot+=z.lh+z.pad*2;return}
      doc.setFontSize(z.f);doc.setFont('helvetica','bold');
      var l1=doc.splitTextToSize(r.con,wCon-4).length;
      doc.setFontSize(z.fd);doc.setFont('helvetica','normal');
      var l2=r.det?doc.splitTextToSize(r.det,wDet-4).length:0;
      tot+=Math.max(l1*z.lh,l2*z.lhd,z.lh)+z.pad*2;
    });
    if(tot<=avail){cfg=z;break}
  }

  var y=0;
  fill(0,0,W,20,blanco);ln(0,20,W,20,navy,0.8);
  var logoH=12,logoW=LOGO_DATA?(LOGO_W/LOGO_H)*logoH:40;
  if(LOGO_DATA){try{doc.addImage(LOGO_DATA,'PNG',M,4,logoW,logoH)}catch(e){txt('TornoAuto',M,13,navy,18,true)}}
  else{txt('TornoAuto',M,13,navy,18,true)}
  txt(textoDocumentoMayus(),W-M,8,gry,8,false,'right');
  txt('#'+c.folio,W-M,16,red,15,true,'right');
  y=20;

  fill(0,y,W,16,blanco);
  ln(0,y,W,y,navy,0.5);
  ln(0,y+16,W,y+16,navy,0.5);
  txt('CLIENTE',M,y+5.5,gry,7,true);
  txt(c.cliente,M,y+12,navy,12,true);
  ln(W/2,y+2.5,W/2,y+13.5,brd,0.3);
  txt('MOTOR',W/2+5,y+5.5,gry,7,true);
  doc.setFontSize(10);doc.setFont('helvetica','bold');
  doc.setTextColor(navy[0],navy[1],navy[2]);
  var mLines=doc.splitTextToSize(c.motor,W/2-M-7);
  doc.text(mLines.slice(0,2),W/2+5,y+11.5);
  y+=19;

  function divisoresRow(yy,h){
    ln(M,yy,M,yy+h,navy,0.3);
    ln(W-M,yy,W-M,yy+h,navy,0.3);
    ln(xDet,yy,xDet,yy+h,divCol,0.15);
    if(mostrar)ln(xPre,yy,xPre,yy+h,divCol,0.15);
  }

  function bandaNavy(titulo){
    var hh=7;
    fill(M,y,wTabla,hh,navy);
    txt(titulo,xCon+2,y+4.8,blanco,7.5,true);
    txt('COMENTARIOS',xDet+2,y+4.8,blanco,7.5,true);
    if(mostrar)txt('VALORES',W-M-2,y+4.8,blanco,7.5,true,'right');
    ln(xDet,y,xDet,y+hh,divNavy,0.15);
    if(mostrar)ln(xPre,y,xPre,y+hh,divNavy,0.15);
    y+=hh;
  }

  function saltoPagina(){
    ln(M,y,W-M,y,navy,0.4);
    doc.addPage();y=10;
    bandaNavy('MANO DE OBRA');
  }

  bandaNavy('MANO DE OBRA');

  rows.forEach(function(r){
    if(r.t==='gap'){
      ln(M,y,W-M,y,navy,0.4);
      y+=GAP;return;
    }
    if(r.t==='sec'){
      var h1=cfg.lh+cfg.pad*2;
      if(y+h1>H-35)saltoPagina();
      txt(r.txt,M+2,y+cfg.pad+cfg.lh-0.8,navy,cfg.f,true);
      ln(M,y+h1,W-M,y+h1,brd,0.25);
      divisoresRow(y,h1);
      y+=h1;return;
    }
    if(r.t==='secnav'){
      var h2=7;
      if(y+h2>H-35)saltoPagina();
      fill(M,y,wTabla,h2,navy);
      txt(r.txt,xCon+2,y+4.8,blanco,7.5,true);
      txt('COMENTARIOS',xDet+2,y+4.8,blanco,7.5,true);
      if(mostrar)txt('VALORES',W-M-2,y+4.8,blanco,7.5,true,'right');
      ln(xDet,y,xDet,y+h2,divNavy,0.15);
      if(mostrar)ln(xPre,y,xPre,y+h2,divNavy,0.15);
      y+=h2;return;
    }
    if(r.t==='sub'){
      var h3=cfg.lh+cfg.pad*2;
      if(y+h3>H-35)saltoPagina();
      fill(M,y,wTabla,h3,subBg);
      ln(M,y,W-M,y,navy,0.35);
      ln(M,y+h3,W-M,y+h3,navy,0.35);
      ln(M,y,M,y+h3,navy,0.3);ln(W-M,y,W-M,y+h3,navy,0.3);
      txt(r.txt,W-M-(mostrar?32:2),y+cfg.pad+cfg.lh-0.8,navy,cfg.fd,true,'right');
      if(mostrar)txt(r.pre,W-M-2,y+cfg.pad+cfg.lh-0.8,navy,cfg.f,true,'right');
      y+=h3;return;
    }
    doc.setFontSize(cfg.f);doc.setFont('helvetica','bold');
    var l1=doc.splitTextToSize(r.con,wCon-4);
    doc.setFontSize(cfg.fd);doc.setFont('helvetica','normal');
    var l2=r.det?doc.splitTextToSize(r.det,wDet-4):[];
    var rh=Math.max(l1.length*cfg.lh,l2.length*cfg.lhd,cfg.lh)+cfg.pad*2;
    if(y+rh>H-35)saltoPagina();
    l1.forEach(function(l,k){txt(l,xCon+2,y+cfg.pad+cfg.lh*(k+1)-0.8,drk,cfg.f,false)});
    l2.forEach(function(l,k){txt(l,xDet+2,y+cfg.pad+cfg.lhd*(k+1)-0.8,gry,cfg.fd,false)});
    if(mostrar)txt(r.pre,W-M-2,y+cfg.pad+cfg.lh-0.8,navy,cfg.f,true,'right');
    ln(M,y+rh,W-M,y+rh,[243,244,247],0.1);
    divisoresRow(y,rh);
    y+=rh;
  });

  ln(M,y,W-M,y,navy,0.4);
  y+=3;

  if(y+16>H-25){doc.addPage();y=10}
  fill(M,y,wTabla,12,navy);
  txt('TOTAL',M+5,y+8.2,blanco,14,true);
  if(mostrar)txt('Q '+c.total.toLocaleString('es-GT',{minimumFractionDigits:2}),W-M-5,y+8.2,blanco,14,true,'right');
  y+=14.5;

  if(esCot){
    fill(M,y,wTabla,7,[253,240,242]);fill(M,y,1.5,7,red);
    txt('Anticipo: Se requiere 50% del total para iniciar trabajo.',M+4,y+4.7,drk,7.5,false);
    y+=9;
  }

  fill(0,H-8,W,8,bgc);
  var tf=tipoDocumento==='Cotizacion'?'Cotización válida por 15 días · TornoAuto':'Comprobante generado · TornoAuto';
  txt(tf,W/2,H-3,gry,7,false,'center');
}

function descargarPDF(tipo){
  var c=cotFiltrada();if(!c)return;
  precargarLogo(function(){
    var jsPDF=window.jspdf.jsPDF;
    var nombreArchivo = tipoDocumento === 'Cotizacion' ? 'Cotizacion' : 'Comprobante';
    if(tipo==='carta'){
      var doc=new jsPDF({unit:'mm',format:'letter'});
      dibujarPDFCartaTabla(doc,c,preciosVisibles);
      doc.save(nombreArchivo+'_'+c.folio+'_carta.pdf');
    }else{
      var W=80;
      var tmp=new jsPDF({unit:'mm',format:[W,300]});

      dibujarPDF(doc2,W,c,preciosVisibles,false);
      doc2.save(nombreArchivo+'_'+c.folio+'_ticket.pdf');
    }
  });
}

            if(r.marca && r.marca!=='---')det.push('Marca: '+r.marca);
            if(r.nr && r.nr!==r.repuesto)det.push('NR: '+r.nr);
            if(det.length){y=wrapTxt(det.join(' · '),M,y+14,gray,FS_DET,false,W-M*2,20)+3}
            if(r.comentario){y=wrapTxt('Nota: '+r.comentario,M,y+14,gray,FS_DET,false,W-M*2,20)+3}
            ln(M,y+2,W-M,y+2,'#f3f4f7',0.5);y+=14;
          });
        }else{
          sec.items.forEach(function(item){
            var maxNombre=preciosVisibles?W-M-160:W-M*2;
            var yNombre=wrapTxt(item.nombre||'',M,y+14,'#1e2a3a',FS_ITEM,false,maxNombre-M,26);
            if(preciosVisibles)txt(fmt(item.precio),W-M,y+14,navy,FS_PRICE,true,'right');
            y=yNombre;
            var coment=(item.manejaCantidad?(item.cantidad||1)+'× ':'')+(item.comentario||'');
            if(coment){y=wrapTxt(coment,M,y+12,gray,FS_DET,false,W-M*2,20)+3}
            if(item.actividades && item.actividades.length>0){
              var rows=[];
              item.actividades.forEach(function(a){
                var nombreAct='• '+(a.actividad||'-');
                ctx.font='16px -apple-system,system-ui,sans-serif';
                var medW=a.medida?ctx.measureText(a.medida).width+22:0;
                var maxActW=W-M*2-22-medW;
                var actLines=[],words=nombreAct.split(' '),line='';
                for(var k=0;k<words.length;k++){var t=line?line+' '+words[k]:words[k];if(ctx.measureText(t).width>maxActW&&line){actLines.push(line);line=words[k]}else line=t}
                if(line)actLines.push(line);
                rows.push({lines:actLines,medida:a.medida});
              });
              var totalRows=rows.reduce(function(a,r){return a+r.lines.length},0);
              fill(M,y,W-M*2,totalRows*28+12,'#f7f9fc');
              fill(M,y,3,totalRows*28+12,navy);
              y+=8;
              rows.forEach(function(rw){
                rw.lines.forEach(function(l,idx){
                  txt(l,M+12,y+14,'#1e2a3a',16,false);
                  if(idx===rw.lines.length-1 && rw.medida){
                    ctx.font='16px -apple-system,system-ui,sans-serif';
                    var wAct=ctx.measureText(l).width;
                    ctx.font='bold 15px -apple-system,system-ui,sans-serif';
                    var wMed=ctx.measureText(rw.medida).width;
                    var pillX=M+12+wAct+8,pillY=y+1,pillW=wMed+14,pillH=22;
                    ctx.fillStyle='#ffffff';ctx.strokeStyle=border;ctx.lineWidth=1;
                    if(ctx.roundRect){ctx.beginPath();ctx.roundRect(pillX,pillY,pillW,pillH,4);ctx.fill();ctx.stroke()}
                    else{ctx.fillRect(pillX,pillY,pillW,pillH);ctx.strokeRect(pillX,pillY,pillW,pillH)}
                    txt(rw.medida,pillX+7,y+17,red,15,true);
                  }
                  y+=28;
                });
              });
              y+=6;
            }
            ln(M,y+4,W-M,y+4,'#f3f4f7',0.5);y+=14;
          });
        }
        y+=8;ln(M,y,W-M,y,border,0.8);y+=6;
    if(grupo.flags[i]){
          if(i===grupo.lastIdx){
            fill(M,y,W-M*2,42,'#e4eaf4');
            ln(M,y,W-M,y,navy,1.5);ln(M,y+42,W-M,y+42,navy,1.5);
            txt('SUBTOTAL MANO DE OBRA',W-M-140,y+27,navy,15,true,'right');
            txt(fmt(grupo.suma),W-M-10,y+28,navy,FS_SUB,true,'right');
            y+=56;
          }else{
            y+=6;
          }
        }else{
          fill(M,y,W-M*2,42,'#e4eaf4');
          ln(M,y,W-M,y,navy,1.5);ln(M,y+42,W-M,y+42,navy,1.5);
          txt(sec.tipo==='repuestos'?'SUBTOTAL REPUESTOS':'SUBTOTAL',W-M-140,y+27,navy,15,true,'right');
          txt(fmt(sec.subtotal),W-M-10,y+28,navy,FS_SUB,true,'right');
          y+=56;
        }
      });
      ctx.fillStyle=navy;
      if(ctx.roundRect){ctx.beginPath();ctx.roundRect(M,y,W-M*2,66,12);ctx.fill()}
      else{ctx.fillRect(M,y,W-M*2,66)}
      txt('TOTAL',M+22,y+44,'#ffffff',34,true);
      txt('Q '+c.total.toLocaleString('es-GT',{minimumFractionDigits:2}),W-M-18,y+44,'#ffffff',34,true,'right');
      y+=82;
      if(tipoDocumento==='Cotizacion'){
        fill(M,y,W-M*2,40,'#fdf0f2');fill(M,y,4,40,red);
        txt('Anticipo: Se requiere 50% del total para iniciar trabajo.',M+16,y+25,'#1e2a3a',16,false);
        y+=54;
      }
      
      var txtFootImg = tipoDocumento === 'Cotizacion' ? 'Cotización válida por 15 días · TornoAuto' : 'Comprobante generado · TornoAuto';
      fill(0,y,W,30,bg);txt(txtFootImg,W/2,y+19,gray,15,false,'center');y+=30;
      
      var final=document.createElement('canvas');final.width=W*S;final.height=y*S;
      final.getContext('2d').drawImage(canvas,0,0);
      var link=document.createElement('a');
      var nombreArchivoImg = tipoDocumento === 'Cotizacion' ? 'Cotizacion' : 'Comprobante';
      link.download=nombreArchivoImg+'_'+c.folio+'.png';link.href=final.toDataURL('image/png');link.click();
    };
    if(LOGO_DATA){logoImg.onload=function(){dibujar(true)};logoImg.onerror=function(){dibujar(false)};logoImg.src=LOGO_DATA}
    else{dibujar(false)}
  });
}
</script>
</body>
</html>
