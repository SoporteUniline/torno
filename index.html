<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotización | TornoAuto</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--n:#1a3057;--r:#c8102e;--nl:#edf1f7;--m:#7a8899;--b:#dde3ec}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,system-ui,'Segoe UI',sans-serif;background:#e5ddd5;display:flex;flex-direction:column;align-items:center;padding:16px;gap:16px}
  .loader{border:3px solid #f3f4f6;border-top:3px solid var(--n);border-radius:50%;width:36px;height:36px;animation:spin .8s linear infinite;margin:30px auto}
  @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  .msg-box{width:100%;max-width:600px;background:#fff;border-radius:16px;padding:40px;box-shadow:0 2px 16px rgba(0,0,0,.1);text-align:center}
  .msg-box p{font-size:14px;color:var(--m)}
  .msg-error{color:var(--r)!important;font-weight:700;font-size:18px!important}
  .c{width:100%;max-width:600px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.12);display:none}
  .hd{background:#fff;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--n)}
  .lg-img{height:54px;width:auto;display:block}
  .cn{text-align:right;color:var(--n)}
  .cn small{font-size:10px;text-transform:uppercase;letter-spacing:2px;opacity:.6;color:var(--m)}
  .cn strong{font-size:32px;font-weight:900;display:block;line-height:1.1;color:var(--r)}
  .cl{display:flex;background:var(--nl);border-bottom:1px solid var(--b)}
  .cl div{flex:1;padding:14px 28px}
  .cl div:first-child{border-right:1px solid var(--b)}
  .cl span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--n);font-weight:700;margin-bottom:4px}
  .cl strong{font-size:16px;color:#1e2a3a}
  .bar{padding:16px 28px 0;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
  .pbtn{border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:700;padding:10px 18px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .pbtn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .pbtn:active{transform:scale(.97)}
  .pbtn-toggle{background:var(--n)}
  .pbtn-toggle.off{background:var(--r)}
  .pbtn-carta{background:#065f46}
  .pbtn-ticket{background:#7c3aed}
  .pbtn-img{background:#b45309}
  .sel-filtro{border:2px solid var(--b);border-radius:8px;background:#f0f4f8;color:var(--n);font-size:12px;font-weight:700;padding:9px 12px;cursor:pointer;outline:none;transition:all .15s}
  .sel-filtro:focus{border-color:var(--n)}
  .bd{padding:12px 28px 20px}
  .s{margin-bottom:14px}
  .st{font-size:13px;text-transform:uppercase;letter-spacing:2px;color:var(--n);font-weight:800;padding-bottom:6px;border-bottom:2.5px solid var(--r);display:inline-block;margin-bottom:8px}
  .rw{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid #f0f1f4;gap:10px}
  .rw:last-of-type{border-bottom:none}
  .rn{font-size:16px;font-weight:700;color:#1e2a3a;flex:1;line-height:1.35}
  .rd{font-size:13px;color:var(--m);line-height:1.3;margin-top:2px}
  .acts{margin-top:6px;padding:8px 10px;background:#f7f9fc;border-left:3px solid var(--n);border-radius:0 6px 6px 0}
  .act{display:flex;justify-content:flex-start;align-items:baseline;padding:3px 0;gap:10px}
  .act-n{font-size:13px;color:#1e2a3a;font-weight:600}
  .act-m{font-size:12px;color:var(--r);font-weight:700;white-space:nowrap;background:#fff;padding:1px 8px;border-radius:4px;border:1px solid var(--b)}
  .rep{padding:10px 0;border-bottom:1px solid #f0f1f4}
  .rep:last-child{border-bottom:none}
  .rep-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .rep-nombre{font-size:15px;color:#1e2a3a;font-weight:700;flex:1}
  .rep-nombre .qty{color:var(--r);margin-right:4px}
  .rep-total{font-size:14px;color:var(--n);font-weight:800;white-space:nowrap;transition:all .25s}
  .rep-total.hide{opacity:0;font-size:0}
  .rep-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .rep-tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--nl);color:var(--n);white-space:nowrap;border:1px solid var(--b)}
  .rep-tag b{color:var(--m);font-weight:600;margin-right:4px;text-transform:uppercase;font-size:9px;letter-spacing:.5px}
  .rep-coment{font-size:12px;color:var(--m);font-style:italic;margin-top:4px}
  .rp{font-size:15px;color:var(--n);font-weight:800;white-space:nowrap;text-align:right;min-width:80px;transition:all .25s}
  .rp.hide{opacity:0;font-size:0;min-width:0;overflow:hidden}
  .sb{display:flex;justify-content:flex-end;align-items:center;padding-top:8px;margin-top:6px;border-top:1.5px dashed var(--b);gap:10px}
  .sb small{font-size:13px;color:var(--m)}
  .sb strong{font-size:17px;color:var(--n)}
  .tb{background:var(--n);border-radius:12px;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;margin:14px 0}
  .tb span{font-size:14px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
  .tb strong{font-size:32px;font-weight:900;color:#fff;letter-spacing:-.5px}
  .tb strong small{font-size:18px;font-weight:600;opacity:.5;margin-right:4px}
  .nt{padding:12px 18px;background:#fdf0f2;border-left:4px solid var(--r);border-radius:0 8px 8px 0;font-size:14px;color:#1e2a3a;line-height:1.4}
  .nt b{color:var(--r)}
  .ft{background:var(--nl);padding:12px;text-align:center;font-size:12px;color:var(--m)}
  @media(max-width:480px){
    body{padding:8px}
    .hd{padding:14px 18px}
    .lg-img{height:42px}
    .cn strong{font-size:24px}
    .cl div{padding:10px 18px}
    .cl strong{font-size:14px}
    .bar{padding:12px 18px 0;gap:6px}
    .pbtn{font-size:11px;padding:8px 12px}
    .bd{padding:10px 18px 16px}
    .rn{font-size:14px}
    .rp{font-size:13px;min-width:65px}
    .tb strong{font-size:26px}
  }
</style>
</head>
<body>

<div class="msg-box" id="msgBox">
  <div class="loader"></div>
  <p>Cargando cotización...</p>
</div>

<div class="c" id="cotCard">
  <div class="hd">
    <img src="https://res.cloudinary.com/djtjnoajc/image/upload/v1778773818/tornoauto-imagotipo-_-slogan-full-color-rgb-900px-w-72ppi_ovzkdr.png" alt="TornoAuto" class="lg-img" id="logoImg" crossorigin="anonymous">
    <div class="cn"><small>Cotización</small><strong id="cotFolio">#---</strong></div>
  </div>
  <div class="cl">
    <div><span>Cliente</span><strong id="cotCliente">-</strong></div>
    <div><span>Motor</span><strong id="cotMotor">-</strong></div>
  </div>
  <div class="bar">
    <select id="selFiltro" class="sel-filtro">
      <option value="todo">📋 Todo</option>
      <option value="mo">🔧 Solo mano de obra</option>
      <option value="rep">🔩 Solo repuestos</option>
    </select>
    <button class="pbtn pbtn-toggle" id="btnPrecios" onclick="togglePrecios()">🙈 Ocultar precios</button>
    <button class="pbtn pbtn-carta" onclick="descargarPDF('carta')">📄 PDF Carta</button>
    <button class="pbtn pbtn-ticket" onclick="descargarPDF('ticket')">🧾 PDF Ticket</button>
    <button class="pbtn pbtn-img" onclick="descargarImagen()">🖼 Imagen</button>
  </div>
  <div class="bd" id="cotBody"></div>
  <div class="ft">Cotización válida por 15 días · TornoAuto</div>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbwWp4e9m6SME8Eo4l5wPJ0K-5l7UIN7-L7hiDByYAeVSap3hDxuGrWJKTkWsHK49IPc/exec';

var cotData=null,preciosVisibles=true,LOGO_URL='https://res.cloudinary.com/djtjnoajc/image/upload/v1777399852/tornoauto-imagotipo-full-color-rgb-900px-w-72ppi_wgbkmp.png',LOGO_DATA=null,LOGO_W=900,LOGO_H=200;

function getFolio(){
  var p=new URLSearchParams(window.location.search);
  return p.get('folio')||p.get('f')||'';
}

function precargarLogo(cb){
  if(LOGO_DATA){cb();return}
  var img=new Image();img.crossOrigin='anonymous';
  img.onload=function(){
    LOGO_W=img.naturalWidth;LOGO_H=img.naturalHeight;
    var cv=document.createElement('canvas');cv.width=LOGO_W;cv.height=LOGO_H;
    cv.getContext('2d').drawImage(img,0,0);
    try{LOGO_DATA=cv.toDataURL('image/png')}catch(e){LOGO_DATA=null}
    cb();
  };
  img.onerror=function(){cb()};
  img.src=LOGO_URL;
}

window.onload=function(){
  precargarLogo(function(){});
  var folio=getFolio();
  if(!folio){
    document.getElementById('msgBox').innerHTML='<p class="msg-error">❌ No se proporcionó folio</p><p style="margin-top:10px;font-size:13px">Usa: ?folio=XXXXXX</p>';
    return;
  }
  fetch(API_URL+'?folio='+encodeURIComponent(folio))
    .then(function(r){return r.json()})
    .then(function(r){
      document.getElementById('msgBox').style.display='none';
      if(r.success){cotData=r.cotizacion;renderCotizacion(cotFiltrada())}
      else{
        document.getElementById('msgBox').style.display='block';
        document.getElementById('msgBox').innerHTML='<p class="msg-error">❌ '+(r.error||'Error desconocido')+'</p>';
      }
    })
    .catch(function(err){
      document.getElementById('msgBox').innerHTML='<p class="msg-error">❌ '+err.message+'</p>';
    });
};

function fmt(n){return 'Q '+n.toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2})}

function cotFiltrada(){
  if(!cotData)return null;
  var filtro=document.getElementById('selFiltro').value;
  if(filtro==='todo')return cotData;
  var secs=cotData.secciones.filter(function(s){
    if(filtro==='mo')return s.tipo==='manoObra';
    if(filtro==='rep')return s.tipo==='repuestos';
    return true;
  });
  var total=secs.reduce(function(a,s){return a+s.subtotal},0);
  return Object.assign({},cotData,{secciones:secs,total:Math.round(total*100)/100});
}

function renderCotizacion(c){
  document.getElementById('cotFolio').textContent='#'+c.folio;
  document.getElementById('cotCliente').textContent=c.cliente||'-';
  document.getElementById('cotMotor').textContent=c.motor||'-';
  var h='';
  c.secciones.forEach(function(sec){
    h+='<div class="s"><div class="st">'+sec.titulo+'</div>';
    if(sec.tipo==='repuestos'){
      sec.items.forEach(function(r){
        h+='<div class="rep"><div class="rep-hd">'
          +'<span class="rep-nombre"><span class="qty">'+(r.cantidad||1)+'×</span> '+(r.repuesto||r.nr||'-')+'</span>'
          +'<span class="rep-total precio">'+fmt(r.total||0)+'</span>'
          +'</div>';
        var tags='';
        if(r.medida)tags+='<span class="rep-tag"><b>Medida</b>'+r.medida+'</span>';
        if(r.escadm)tags+='<span class="rep-tag"><b>ESC/ADM</b>'+r.escadm+'</span>';
        if(r.presentacion)tags+='<span class="rep-tag"><b>Present.</b>'+r.presentacion+'</span>';
        if(r.contiene)tags+='<span class="rep-tag"><b>Contiene</b>'+r.contiene+'</span>';
        if(r.marca && r.marca!=='---')tags+='<span class="rep-tag"><b>Marca</b>'+r.marca+'</span>';
        if(r.nr && r.nr!==r.repuesto)tags+='<span class="rep-tag"><b>NR</b>'+r.nr+'</span>';
        if(tags)h+='<div class="rep-tags">'+tags+'</div>';
        if(r.comentario)h+='<div class="rep-coment">💬 '+r.comentario+'</div>';
        h+='</div>';
      });
    }else{
      sec.items.forEach(function(item){
        h+='<div class="rw"><div class="rn">'+item.nombre;
        if(item.comentario)h+='<div class="rd">'+item.comentario+'</div>';
        if(item.actividades && item.actividades.length>0){
          h+='<div class="acts">';
          item.actividades.forEach(function(a){
            h+='<div class="act"><span class="act-n">'+(a.actividad||'-')+'</span>';
            if(a.medida)h+='<span class="act-m">'+a.medida+'</span>';
            h+='</div>';
          });
          h+='</div>';
        }
        h+='</div><span class="rp precio">'+fmt(item.precio)+'</span></div>';
      });
    }
    h+='<div class="sb"><small>Subtotal</small><strong>'+fmt(sec.subtotal)+'</strong></div></div>';
  });
  h+='<div class="tb"><span>Total</span><strong><small>Q</small> '+c.total.toLocaleString('es-GT',{minimumFractionDigits:2})+'</strong></div>';
  h+='<div class="nt"><b>⚠ Anticipo:</b> Se requiere 50% del total para iniciar trabajo.</div>';
  document.getElementById('cotBody').innerHTML=h;
  document.getElementById('cotCard').style.display='block';
}

document.getElementById('selFiltro').addEventListener('change',function(){
  if(cotData)renderCotizacion(cotFiltrada());
});

function togglePrecios(){
  preciosVisibles=!preciosVisibles;
  document.querySelectorAll('.precio').forEach(function(el){el.classList.toggle('hide',!preciosVisibles)});
  var b=document.getElementById('btnPrecios');
  b.innerHTML=preciosVisibles?'🙈 Ocultar precios':'👁 Mostrar precios';
  b.classList.toggle('off',!preciosVisibles);
}

function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}

function dibujarPDF(doc,W,c,mostrar,esCarta){
  var navy='#1a3057',red='#c8102e',bg='#edf1f7',gray='#7a8899',border='#dde3ec';
  var M=esCarta?20:6,y=0;
  var fs=esCarta?{h1:18,h2:14,h3:12,body:10,small:8,tiny:6,total:22,sub:9}:{h1:10,h2:9,h3:5.5,body:6,small:4,tiny:3.5,total:9.5,sub:5.5};
  function rgb(h){return hexRgb(h)}
  function fill(x,yy,w,h,col){var r=rgb(col);doc.setFillColor(r[0],r[1],r[2]);doc.rect(x,yy,w,h,'F')}
  function txt(t,x,yy,col,sz,bold,align){var r=rgb(col);doc.setTextColor(r[0],r[1],r[2]);doc.setFontSize(sz);doc.setFont('helvetica',bold?'bold':'normal');doc.text(t+'',x,yy,{align:align||'left'})}
  function ln(x1,y1,x2,y2,col,w){var r=rgb(col);doc.setDrawColor(r[0],r[1],r[2]);doc.setLineWidth(w||0.2);doc.line(x1,y1,x2,y2)}
  var hdrH=esCarta?28:14;
  fill(0,y,W,hdrH,'#ffffff');ln(0,y+hdrH,W,y+hdrH,navy,esCarta?1:0.5);
  var logoH=esCarta?16:9;
  var logoW=LOGO_DATA?(LOGO_W/LOGO_H)*logoH:logoH*4;
  if(LOGO_DATA){try{doc.addImage(LOGO_DATA,'PNG',M,y+(hdrH-logoH)/2,logoW,logoH)}catch(e){txt('TornoAuto',M,y+(esCarta?16:9),navy,fs.h1,true)}}
  else{txt('TornoAuto',M,y+(esCarta?16:9),navy,fs.h1,true)}
  txt('COTIZACIÓN',W-M,y+(esCarta?10:5.5),gray,fs.tiny,false,'right');
  txt('#'+c.folio,W-M,y+(esCarta?22:11.5),red,fs.h2,true,'right');
  y+=hdrH;
  var infoH=esCarta?24:11;
  fill(0,y,W,infoH,bg);ln(0,y+infoH,W,y+infoH,border);
  txt('CLIENTE',M,y+(esCarta?8:4),navy,fs.tiny,true);
  txt(c.cliente,M,y+(esCarta?17:8.5),'#1e2a3a',fs.body,true);
  ln(W/2,y,W/2,y+infoH,border);
  txt('MOTOR',W/2+(esCarta?10:4),y+(esCarta?8:4),navy,fs.tiny,true);
  doc.setFontSize(esCarta?fs.small:fs.tiny+1.5);doc.setFont('helvetica','normal');
  var motorLines=doc.splitTextToSize(c.motor,W/2-M-(esCarta?12:4));
  doc.setTextColor(hexRgb('#1e2a3a')[0],hexRgb('#1e2a3a')[1],hexRgb('#1e2a3a')[2]);
  doc.text(motorLines,W/2+(esCarta?10:4),y+(esCarta?15:8.5));
  y+=infoH+(esCarta?4:2);
  c.secciones.forEach(function(sec){
    if(esCarta&&y>260){doc.addPage();y=20}
    txt(sec.titulo.toUpperCase(),M,y+(esCarta?6:3),navy,fs.small,true);
    var tw=doc.getTextWidth(sec.titulo.toUpperCase());
    fill(M,y+(esCarta?8:4),tw+2,esCarta?1.2:0.6,red);
    y+=esCarta?14:6;
    if(sec.tipo==='repuestos'){
      sec.items.forEach(function(r){
        if(esCarta&&y>260){doc.addPage();y=20}
        var linea=(r.cantidad||1)+'× '+(r.repuesto||r.nr||'-');
        txt(linea,M,y+(esCarta?5:3),'#1e2a3a',fs.body,false);
        if(mostrar)txt(fmt(r.total||0),W-M,y+(esCarta?5:3),navy,fs.sub,true,'right');
        y+=esCarta?6:3;
        var det=[];
        if(r.medida)det.push('Med:'+r.medida);
        if(r.escadm)det.push('ESC/ADM:'+r.escadm);
        if(r.presentacion)det.push('Pres:'+r.presentacion);
        if(r.contiene)det.push('Cont:'+r.contiene);
        if(r.marca && r.marca!=='---')det.push('Marca:'+r.marca);
        if(r.nr && r.nr!==r.repuesto)det.push('NR:'+r.nr);
        if(det.length){
          var lines=doc.splitTextToSize(det.join(' · '),W-M*2-(esCarta?4:2));
          lines.forEach(function(l){
            if(esCarta&&y>275){doc.addPage();y=20}
            txt(l,M+(esCarta?4:2),y+(esCarta?3.5:2),gray,fs.tiny+1,false);
            y+=esCarta?4:2.2;
          });
        }
        if(r.comentario){
          if(esCarta&&y>275){doc.addPage();y=20}
          txt('💬 '+r.comentario,M+(esCarta?4:2),y+(esCarta?3.5:2),gray,fs.tiny+1,false);
          y+=esCarta?4:2.2;
        }
        ln(M,y+(esCarta?1:0.5),W-M,y+(esCarta?1:0.5),'#f3f4f7',0.1);
        y+=esCarta?3:1.5;
      });
    }else{
      sec.items.forEach(function(item){
        if(esCarta&&y>265){doc.addPage();y=20}
        txt(item.nombre||'',M,y+(esCarta?5:3),'#1e2a3a',fs.body,false);
        if(mostrar)txt(fmt(item.precio),W-M,y+(esCarta?5:3),navy,fs.sub,true,'right');
        y+=esCarta?8:4;
        if(item.comentario){txt(item.comentario,M,y+(esCarta?4:2.5),gray,fs.small,false);y+=esCarta?7:3}
        if(item.actividades && item.actividades.length>0){
          item.actividades.forEach(function(a){
            if(esCarta&&y>270){doc.addPage();y=20}
            var nombreAct='• '+(a.actividad||'-');
            txt(nombreAct,M+(esCarta?4:1.5),y+(esCarta?4:2.5),navy,fs.small,false);
            if(a.medida){
              var offsetX=doc.getTextWidth(nombreAct);
              txt(a.medida,M+(esCarta?4:1.5)+offsetX+(esCarta?3:1),y+(esCarta?4:2.5),red,fs.small,true);
            }
            y+=esCarta?5:2.5;
          });
          y+=esCarta?2:1;
        }
        ln(M,y,W-M,y,'#f3f4f7',0.1);y+=esCarta?3:1;
      });
    }
    ln(M,y,W-M,y,border,0.2);y+=esCarta?2:1;
    txt('Subtotal',W-M-(esCarta?45:28),y+(esCarta?5:3),gray,fs.small,false);
    txt(fmt(sec.subtotal),W-M,y+(esCarta?5:3),navy,fs.sub,true,'right');
    y+=esCarta?12:5;
  });
  var totH=esCarta?18:9;
  if(esCarta&&y>255){doc.addPage();y=20}
  fill(M,y,W-M*2,totH,navy);
  txt('TOTAL',M+(esCarta?10:4),y+totH*0.62,'#8899aa',fs.small,true);
  txt('Q '+c.total.toLocaleString('es-GT',{minimumFractionDigits:2}),W-M-(esCarta?8:3),y+totH*0.68,'#ffffff',fs.total,true,'right');
  y+=totH+(esCarta?6:2);
  var ntH=esCarta?14:7;
  fill(M,y,W-M*2,ntH,'#fdf0f2');fill(M,y,esCarta?2.5:1.5,ntH,red);
  txt('Anticipo: Se requiere 50% del total para iniciar trabajo.',M+(esCarta?10:4),y+ntH*0.62,'#1e2a3a',fs.small,false);
  y+=ntH+(esCarta?6:2);
  fill(0,y,W,esCarta?12:6,bg);
  txt('Cotización válida por 15 días · TornoAuto',W/2,y+(esCarta?8:4),gray,fs.tiny+1,false,'center');
  y+=(esCarta?12:6);
  return y;
}

function descargarPDF(tipo){
  var c=cotFiltrada();if(!c)return;
  precargarLogo(function(){
    var jsPDF=window.jspdf.jsPDF;
    if(tipo==='carta'){
      var doc=new jsPDF({unit:'mm',format:'letter'});
      dibujarPDF(doc,doc.internal.pageSize.getWidth(),c,preciosVisibles,true);
      doc.save('Cotizacion_'+c.folio+'_carta.pdf');
    }else{
      var W=80;
      var tmp=new jsPDF({unit:'mm',format:[W,300]});
      var h=dibujarPDF(tmp,W,c,preciosVisibles,false);
      var doc2=new jsPDF({unit:'mm',format:[W,h+2]});
      dibujarPDF(doc2,W,c,preciosVisibles,false);
      doc2.save('Cotizacion_'+c.folio+'_ticket.pdf');
    }
  });
}

function descargarImagen(){
  var c=cotFiltrada();if(!c)return;
  precargarLogo(function(){
    var logoImg=new Image();
    var dibujar=function(logoOk){
      var W=600,S=2;
      var canvas=document.createElement('canvas');canvas.width=W*S;canvas.height=2400*S;
      var ctx=canvas.getContext('2d');ctx.scale(S,S);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,2400);
      var navy='#1a3057',red='#c8102e',bg='#edf1f7',gray='#7a8899',border='#dde3ec';
      var M=24,y=0;
      var FS_ITEM=15, FS_PRICE=15, FS_SECT=14, FS_SUB=15, FS_DET=12;
      function fill(x,yy,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,yy,w,h)}
      function txt(t,x,yy,col,sz,bold,align){ctx.fillStyle=col;ctx.font=(bold?'bold ':'')+sz+'px -apple-system,system-ui,sans-serif';ctx.textAlign=align||'left';ctx.fillText(t+'',x,yy)}
      function ln(x1,y1,x2,y2,col,w){ctx.strokeStyle=col;ctx.lineWidth=w||0.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
      var hdrH=80;
      fill(0,y,W,hdrH,'#ffffff');fill(0,y+hdrH-3,W,3,navy);
      if(logoOk){var logoH=48,logoW=(LOGO_W/LOGO_H)*logoH;ctx.drawImage(logoImg,M,y+(hdrH-logoH)/2,logoW,logoH)}
      else{txt('TornoAuto',M,y+45,navy,32,true)}
      txt('COTIZACIÓN',W-M,y+28,gray,12,false,'right');
      txt('#'+c.folio,W-M,y+58,red,28,true,'right');
      y+=hdrH;
      fill(0,y,W,52,bg);ln(0,y+52,W,y+52,border);
      txt('CLIENTE',M,y+18,navy,11,true);txt(c.cliente,M,y+38,'#1e2a3a',18,true);
      ln(W/2,y,W/2,y+52,border);
      txt('MOTOR',W/2+16,y+18,navy,11,true);txt(c.motor,W/2+16,y+38,'#1e2a3a',14,false);
      y+=64;
      c.secciones.forEach(function(sec){
        txt(sec.titulo.toUpperCase(),M,y+10,navy,FS_SECT,true);
        ctx.font='bold '+FS_SECT+'px -apple-system,system-ui,sans-serif';
        ctx.fillStyle=red;ctx.fillRect(M,y+14,ctx.measureText(sec.titulo.toUpperCase()).width+6,2.5);
        y+=24;
        if(sec.tipo==='repuestos'){
          sec.items.forEach(function(r){
            var linea=(r.cantidad||1)+'× '+(r.repuesto||r.nr||'-');
            txt(linea,M,y+11,'#1e2a3a',FS_ITEM,false);
            if(preciosVisibles)txt(fmt(r.total||0),W-M,y+11,navy,FS_PRICE,true,'right');
            y+=18;
            var det=[];
            if(r.medida)det.push('Medida: '+r.medida);
            if(r.escadm)det.push('ESC/ADM: '+r.escadm);
            if(r.presentacion)det.push('Present: '+r.presentacion);
            if(r.contiene)det.push('Cont: '+r.contiene);
            if(r.marca && r.marca!=='---')det.push('Marca: '+r.marca);
            if(r.nr && r.nr!==r.repuesto)det.push('NR: '+r.nr);
            if(det.length){txt(det.join(' · '),M,y+10,gray,FS_DET,false);y+=14}
            if(r.comentario){txt('💬 '+r.comentario,M,y+10,gray,FS_DET,false);y+=14}
            ln(M,y+2,W-M,y+2,'#f3f4f7',0.5);y+=10;
          });
        }else{
          sec.items.forEach(function(item){
            txt(item.nombre||'',M,y+11,'#1e2a3a',FS_ITEM,false);
            if(preciosVisibles)txt(fmt(item.precio),W-M,y+11,navy,FS_PRICE,true,'right');
            y+=18;
            if(item.comentario){txt(item.comentario,M,y+8,gray,FS_DET,false);y+=14}
            if(item.actividades && item.actividades.length>0){
              fill(M,y,W-M*2,item.actividades.length*20+8,'#f7f9fc');
              fill(M,y,3,item.actividades.length*20+8,navy);
              y+=6;
              item.actividades.forEach(function(a){
                var nombreAct='• '+(a.actividad||'-');
                txt(nombreAct,M+10,y+11,'#1e2a3a',13,false);
                if(a.medida){
                  ctx.font='13px -apple-system,system-ui,sans-serif';
                  var wAct=ctx.measureText(nombreAct).width;
                  ctx.font='bold 12px -apple-system,system-ui,sans-serif';
                  var wMed=ctx.measureText(a.medida).width;
                  var pillX=M+10+wAct+8,pillY=y+1,pillW=wMed+12,pillH=16;
                  ctx.fillStyle='#ffffff';ctx.strokeStyle=border;ctx.lineWidth=1;
                  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(pillX,pillY,pillW,pillH,4);ctx.fill();ctx.stroke()}
                  else{ctx.fillRect(pillX,pillY,pillW,pillH);ctx.strokeRect(pillX,pillY,pillW,pillH)}
                  txt(a.medida,pillX+6,y+12,red,12,true);
                }
                y+=20;
              });
              y+=4;
            }
            ln(M,y+4,W-M,y+4,'#f3f4f7',0.5);y+=10;
          });
        }
        y+=8;ln(M,y,W-M,y,border,0.8);y+=18;
        txt('Subtotal',W-M-110,y,gray,13,false,'right');
        txt(fmt(sec.subtotal),W-M,y,navy,FS_SUB,true,'right');
        y+=22;
      });
      ctx.fillStyle=navy;
      if(ctx.roundRect){ctx.beginPath();ctx.roundRect(M,y,W-M*2,52,12);ctx.fill()}
      else{ctx.fillRect(M,y,W-M*2,52)}
      txt('TOTAL',M+20,y+32,'rgba(255,255,255,0.5)',13,true);
      txt('Q '+c.total.toLocaleString('es-GT',{minimumFractionDigits:2}),W-M-16,y+34,'#ffffff',28,true,'right');
      y+=64;
      fill(M,y,W-M*2,32,'#fdf0f2');fill(M,y,4,32,red);
      txt('Anticipo: Se requiere 50% del total para iniciar trabajo.',M+16,y+20,'#1e2a3a',13,false);
      y+=42;
      fill(0,y,W,24,bg);txt('Cotización válida por 15 días · TornoAuto',W/2,y+16,gray,12,false,'center');y+=24;
      var final=document.createElement('canvas');final.width=W*S;final.height=y*S;
      final.getContext('2d').drawImage(canvas,0,0);
      var link=document.createElement('a');link.download='Cotizacion_'+c.folio+'.png';link.href=final.toDataURL('image/png');link.click();
    };
    if(LOGO_DATA){logoImg.onload=function(){dibujar(true)};logoImg.onerror=function(){dibujar(false)};logoImg.src=LOGO_DATA}
    else{dibujar(false)}
  });
}
</script>
