<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotización | TornoAuto</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--n:#1a3057;--r:#c8102e;--nl:#edf1f7;--m:#7a8899;--b:#dde3ec}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,system-ui,'Segoe UI',sans-serif;background:#e5ddd5;display:flex;flex-direction:column;align-items:center;padding:24px;gap:20px}
  .loader{border:4px solid #f3f4f6;border-top:4px solid var(--n);border-radius:50%;width:44px;height:44px;animation:spin .8s linear infinite;margin:40px auto}
  @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  .msg-box{width:100%;max-width:750px;background:#fff;border-radius:16px;padding:50px;box-shadow:0 2px 16px rgba(0,0,0,.1);text-align:center}
  .msg-box p{font-size:16px;color:var(--m)}
  .msg-error{color:var(--r)!important;font-weight:700;font-size:22px!important}
  .c{width:100%;max-width:750px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.12);display:none}
  .hd{background:#fff;padding:24px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--n)}
  .lg-img{height:75px;width:auto;display:block}
  .cn{text-align:right;color:var(--n)}
  .cn small{font-size:13px;text-transform:uppercase;letter-spacing:2px;opacity:.6;color:var(--m)}
  .cn strong{font-size:42px;font-weight:900;display:block;line-height:1.1;color:var(--r)}
  .cl{display:flex;background:var(--nl);border-bottom:1px solid var(--b)}
  .cl div{flex:1;padding:18px 32px;min-width:0}
  .cl div:first-child{border-right:1px solid var(--b)}
  .cl span{display:block;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--n);font-weight:700;margin-bottom:6px}
  .cl strong{font-size:20px;color:#1e2a3a;overflow-wrap:anywhere}
  .bar{padding:20px 32px 0;display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;align-items:center}
  .pbtn{border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:700;padding:12px 20px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .pbtn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .pbtn:active{transform:scale(.97)}
  .pbtn-toggle{background:var(--n)}
  .pbtn-toggle.off{background:var(--r)}
  .pbtn-carta{background:#065f46}
  .pbtn-ticket{background:#7c3aed}
  .pbtn-img{background:#b45309}
  .sel-filtro{border:2px solid var(--b);border-radius:8px;background:#f0f4f8;color:var(--n);font-size:15px;font-weight:700;padding:11px 16px;cursor:pointer;outline:none;transition:all .15s}
  .sel-filtro:focus{border-color:var(--n)}
  .bd{padding:16px 32px 24px}
  .s{margin-bottom:20px}
  .st{font-size:16px;text-transform:uppercase;letter-spacing:2px;color:var(--n);font-weight:800;padding-bottom:8px;border-bottom:3px solid var(--r);display:inline-block;margin-bottom:12px}
  .rw{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid #f0f1f4;gap:12px}
  .rw:last-of-type{border-bottom:none}
  .rn{font-size:19px;font-weight:700;color:#1e2a3a;flex:1;line-height:1.35;min-width:0;overflow-wrap:anywhere}
  .rd{font-size:15px;color:var(--m);line-height:1.3;margin-top:4px;overflow-wrap:anywhere}
  .rd b{color:var(--r);font-weight:800}
  .acts{margin-top:8px;padding:10px 14px;background:#f7f9fc;border-left:4px solid var(--n);border-radius:0 8px 8px 0}
  .act{display:flex;justify-content:flex-start;align-items:baseline;padding:4px 0;gap:12px}
  .act-n{font-size:15px;color:#1e2a3a;font-weight:600;overflow-wrap:anywhere}
  .act-m{font-size:14px;color:var(--r);font-weight:700;white-space:nowrap;background:#fff;padding:2px 10px;border-radius:4px;border:1px solid var(--b)}
  .rep{padding:12px 0;border-bottom:1px solid #f0f1f4}
  .rep:last-child{border-bottom:none}
  .rep-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .rep-nombre{font-size:18px;color:#1e2a3a;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
  .rep-nombre .qty{color:var(--r);margin-right:6px}
  .rep-total{font-size:17px;color:var(--n);font-weight:800;white-space:nowrap;transition:all .25s}
  .rep-total.hide{opacity:0;font-size:0}
  .rep-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .rep-tag{font-size:13px;font-weight:700;padding:3px 9px;border-radius:4px;background:var(--nl);color:var(--n);white-space:normal;overflow-wrap:anywhere;max-width:100%;border:1px solid var(--b)}
  .rep-tag b{color:var(--m);font-weight:600;margin-right:6px;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
  .rep-coment{font-size:14px;color:var(--m);font-style:italic;margin-top:6px;overflow-wrap:anywhere}
  .rp{font-size:18px;color:var(--n);font-weight:800;white-space:nowrap;text-align:right;min-width:100px;transition:all .25s}
  .rp.hide{opacity:0;font-size:0;min-width:0;overflow:hidden}
  .sb{display:flex;justify-content:flex-end;align-items:center;padding-top:12px;margin-top:10px;border-top:2px dashed var(--b);gap:12px}
  .sb small{font-size:15px;color:var(--m)}
  .sb strong{font-size:20px;color:var(--n)}
  .tb{background:var(--n);border-radius:12px;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;margin:20px 0}
  .tb span{font-size:16px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
  .tb strong{font-size:38px;font-weight:900;color:#fff;letter-spacing:-.5px}
  .tb strong small{font-size:22px;font-weight:600;opacity:.5;margin-right:6px}
  .nt{padding:16px 22px;background:#fdf0f2;border-left:5px solid var(--r);border-radius:0 10px 10px 0;font-size:16px;color:#1e2a3a;line-height:1.4}
  .nt b{color:var(--r)}
  .ft{background:var(--nl);padding:16px;text-align:center;font-size:14px;color:var(--m)}
  @media(max-width:480px){
    body{padding:12px}
    .hd{padding:16px 20px}
    .lg-img{height:55px}
    .cn strong{font-size:30px}
    .cl div{padding:12px 20px}
    .cl strong{font-size:16px}
    .bar{padding:14px 20px 0;gap:8px}
    .pbtn{font-size:13px;padding:10px 14px}
    .bd{padding:12px 20px 20px}
    .rn{font-size:16px}
    .rep-nombre{font-size:16px}
    .rp{font-size:15px;min-width:80px}
    .tb strong{font-size:30px}
  }
</style>
</head>
<body>

<div class="msg-box" id="msgBox">
  <div class="loader"></div>
  <p>Cargando cotización...</p>
</div>

<div class="c" id="cotCard">
  <div class="hd">
    <img src="https://res.cloudinary.com/djtjnoajc/image/upload/v1778773818/tornoauto-imagotipo-_-slogan-full-color-rgb-900px-w-72ppi_ovzkdr.png" alt="TornoAuto" class="lg-img" id="logoImg" crossorigin="anonymous">
    <div class="cn"><small id="tituloDocumento">Cotización</small><strong id="cotFolio">#---</strong></div>
  </div>
  <div class="cl">
    <div><span>Cliente</span><strong id="cotCliente">-</strong></div>
    <div><span>Motor</span><strong id="cotMotor">-</strong></div>
  </div>
  <div class="bar">
    <button class="pbtn" id="btnTipoDoc" onclick="toggleTipoDocumento()" style="background:#475569;">📄 Cotización</button>

    <select id="selFiltro" class="sel-filtro">
      <option value="todo">📋 Todo</option>
      <option value="mo">🔧 Solo mano de obra</option>
      <option value="rep">🔩 Solo repuestos</option>
    </select>
    <button class="pbtn pbtn-toggle" id="btnPrecios" onclick="togglePrecios()">🙈 Ocultar precios</button>
    <button class="pbtn pbtn-carta" onclick="descargarPDF('carta')">📄 PDF Carta</button>
    <button class="pbtn pbtn-ticket" onclick="descargarPDF('ticket')">🧾 PDF Ticket</button>
    <button class="pbtn pbtn-img" onclick="descargarImagen()">🖼 Imagen</button>
  </div>
  <div class="bd" id="cotBody"></div>
  <div class="ft" id="footerDocumento">Cotización válida por 15 días · TornoAuto</div>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbz1GkMSXIUofVKdbfxAA_N00kU9nngJ1k6g9NjyO5XSpZkztCLAM7YIRnvGA-w3k_B2/exec';

var cotData=null,preciosVisibles=true,tipoDocumento='Cotizacion',LOGO_URL='https://res.cloudinary.com/djtjnoajc/image/upload/v1778773818/tornoauto-imagotipo-_-slogan-full-color-rgb-900px-w-72ppi_ovzkdr.png',LOGO_DATA=null,LOGO_W=900,LOGO_H=200;

function getFolio(){
  var p=new URLSearchParams(window.location.search);
  return p.get('folio')||p.get('f')||'';
}

function precargarLogo(cb){
  if(LOGO_DATA){cb();return}
  var img=new Image();img.crossOrigin='anonymous';
  img.onload=function(){
    LOGO_W=img.naturalWidth;LOGO_H=img.naturalHeight;
    var cv=document.createElement('canvas');cv.width=LOGO_W;cv.height=LOGO_H;
    cv.getContext('2d').drawImage(img,0,0);
    try{LOGO_DATA=cv.toDataURL('image/png')}catch(e){LOGO_DATA=null}
    cb();
  };
  img.onerror=function(){cb()};
  img.src=LOGO_URL;
}

window.onload=function(){
  precargarLogo(function(){});
  var folio=getFolio();
  if(!folio){
    document.getElementById('msgBox').innerHTML='<p class="msg-error">❌ No se proporcionó folio</p><p style="margin-top:10px;font-size:13px">Usa: ?folio=XXXXXX</p>';
    return;
  }
  fetch(API_URL+'?folio='+encodeURIComponent(folio))
    .then(function(r){return r.json()})
    .then(function(r){
      document.getElementById('msgBox').style.display='none';
      if(r.success){cotData=ordenarCotizacion(r.cotizacion);renderCotizacion(cotFiltrada())}
      else{
        document.getElementById('msgBox').style.display='block';
        document.getElementById('msgBox').innerHTML='<p class="msg-error">❌ '+(r.error||'Error desconocido')+'</p>';
      }
    })
    .catch(function(err){
      document.getElementById('msgBox').innerHTML='<p class="msg-error">❌ '+err.message+'</p>';
    });
};

function toggleTipoDocumento(){
  var btn = document.getElementById('btnTipoDoc');
  var titulo = document.getElementById('tituloDocumento');
  var footer = document.getElementById('footerDocumento');
  
  if(tipoDocumento === 'Cotizacion'){
    tipoDocumento = 'Comprobante';
    if(btn) btn.innerHTML = '🧾 Comprobante';
    if(titulo) titulo.textContent = 'Comprobante';
    if(footer) footer.textContent = 'Comprobante generado · TornoAuto';
    document.title = 'Comprobante | TornoAuto';
  } else {
    tipoDocumento = 'Cotizacion';
    if(btn) btn.innerHTML = '📄 Cotización';
    if(titulo) titulo.textContent = 'Cotización';
    if(footer) footer.textContent = 'Cotización válida por 15 días · TornoAuto';
    document.title = 'Cotización | TornoAuto';
  }
}

function textoDocumentoMayus(){
  return tipoDocumento === 'Cotizacion' ? 'COTIZACIÓN' : 'COMPROBANTE';
}

function fmt(n){return 'Q '+n.toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2})}

function numOrden(v,fallback){
  var n=parseFloat(String(v===null||v===undefined?'':v).replace(',','.'));
  return isNaN(n)?fallback:n;
}

function ordenarCotizacion(c){
  if(!c || !Array.isArray(c.secciones))return c;

  var copia=Object.assign({},c);
  copia.secciones=c.secciones.slice().sort(function(a,b){
    var oa=numOrden(a.ordenCategoria,9999);
    var ob=numOrden(b.ordenCategoria,9999);
    if(oa!==ob)return oa-ob;
    return String(a.titulo||'').localeCompare(String(b.titulo||''));
  }).map(function(sec){
    var secCopia=Object.assign({},sec);
    if(Array.isArray(secCopia.items)){
      secCopia.items=secCopia.items.slice().sort(function(a,b){
        var oa=numOrden(a.orden,numOrden(a.ordenTarifa,9999));
        var ob=numOrden(b.orden,numOrden(b.ordenTarifa,9999));
        if(oa!==ob)return oa-ob;
        var na=String(a.nombre||a.repuesto||a.nr||'');
        var nb=String(b.nombre||b.repuesto||b.nr||'');
        return na.localeCompare(nb);
      });
    }
    return secCopia;
  });

  return copia;
}


function cotFiltrada(){
  if(!cotData)return null;
  var filtro=document.getElementById('selFiltro').value;
  var base=ordenarCotizacion(cotData);
  if(filtro==='todo')return base;
  var secs=base.secciones.filter(function(s){
    if(filtro==='mo')return s.tipo==='manoObra';
    if(filtro==='rep')return s.tipo==='repuestos';
    return true;
  });
  var total=secs.reduce(function(a,s){return a+s.subtotal},0);
  return Object.assign({},cotData,{secciones:secs,total:Math.round(total*100)/100});
}

function renderCotizacion(c){
  document.getElementById('cotFolio').textContent='#'+c.folio;
  document.getElementById('cotCliente').textContent=c.cliente||'-';
  document.getElementById('cotMotor').textContent=c.motor||'-';
  var h='';
  c.secciones.forEach(function(sec){
    h+='<div class="s"><div class="st">'+sec.titulo+'</div>';
    if(sec.tipo==='repuestos'){
      sec.items.forEach(function(r){
        h+='<div class="rep"><div class="rep-hd">'
          +'<span class="rep-nombre">'+((r.cantidad||1)>1?'<span class="qty">'+r.cantidad+'×</span> ':'')+(r.repuesto||r.nr||'-')+'</span>'
          +'<span class="rep-total precio">'+fmt(r.total||0)+'</span>'
          +'</div>';
        var tags='';
        if(r.medida)tags+='<span class="rep-tag"><b>Medida</b>'+r.medida+'</span>';
        if(r.escadm)tags+='<span class="rep-tag"><b>ESC/ADM</b>'+r.escadm+'</span>';
        if(r.presentacion)tags+='<span class="rep-tag"><b>Pres.</b>'+r.presentacion+'</span>';
        if(r.contiene)tags+='<span class="rep-tag"><b>Contiene</b>'+r.contiene+'</span>';
        if(r.marca && r.marca!=='---')tags+='<span class="rep-tag"><b>Marca</b>'+r.marca+'</span>';
        if(r.nr && r.nr!==r.repuesto)tags+='<span class="rep-tag"><b>NR</b>'+r.nr+'</span>';
        if(tags)h+='<div class="rep-tags">'+tags+'</div>';
        if(r.comentario)h+='<div class="rep-coment">Nota: '+r.comentario+'</div>';
        h+='</div>';
      });
    }else{
      sec.items.forEach(function(item){
        h+='<div class="rw"><div class="rn">'+item.nombre;
        if(item.comentario || item.manejaCantidad){
          h+='<div class="rd">'+(item.manejaCantidad?'<b>'+(item.cantidad||1)+'×</b> ':'')+(item.comentario||'')+'</div>';
        }
        if(item.actividades && item.actividades.length>0){
          h+='<div class="acts">';
          item.actividades.forEach(function(a){
            h+='<div class="act"><span class="act-n">'+(a.actividad||'-')+'</span>';
            if(a.medida)h+='<span class="act-m">'+a.medida+'</span>';
            h+='</div>';
          });
          h+='</div>';
        }
        h+='</div><span class="rp precio">'+fmt(item.precio)+'</span></div>';
      });
    }
    h+='<div class="sb"><small>Subtotal</small><strong>'+fmt(sec.subtotal)+'</strong></div></div>';
  });
  h+='<div class="tb"><span>Total</span><strong><small>Q</small> '+c.total.toLocaleString('es-GT',{minimumFractionDigits:2})+'</strong></div>';
  h+='<div class="nt"><b>⚠ Anticipo:</b> Se requiere 50% del total para iniciar trabajo.</div>';
  document.getElementById('cotBody').innerHTML=h;
  document.getElementById('cotCard').style.display='block';
}

document.getElementById('selFiltro').addEventListener('change',function(){
  if(cotData)renderCotizacion(cotFiltrada());
});

function togglePrecios(){
  preciosVisibles=!preciosVisibles;
  document.querySelectorAll('.precio').forEach(function(el){el.classList.toggle('hide',!preciosVisibles)});
  var b=document.getElementById('btnPrecios');
  b.innerHTML=preciosVisibles?'🙈 Ocultar precios':'👁 Mostrar precios';
  b.classList.toggle('off',!preciosVisibles);
}

function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}

function dibujarPDF(doc,W,c,mostrar,esCarta){
  var navy='#1a3057',red='#c8102e',bg='#edf1f7',gray='#7a8899',border='#dde3ec';
  var M=esCarta?20:6,y=0;
  var fs=esCarta?{h1:22,h2:18,h3:14,body:12,small:10,tiny:8,total:26,sub:11}:{h1:12,h2:10,h3:7,body:8,small:6,tiny:5,total:11,sub:7.5};
  function rgb(h){return hexRgb(h)}
  function fill(x,yy,w,h,col){var r=rgb(col);doc.setFillColor(r[0],r[1],r[2]);doc.rect(x,yy,w,h,'F')}
  function txt(t,x,yy,col,sz,bold,align){var r=rgb(col);doc.setTextColor(r[0],r[1],r[2]);doc.setFontSize(sz);doc.setFont('helvetica',bold?'bold':'normal');doc.text(t+'',x,yy,{align:align||'left'})}
  function ln(x1,y1,x2,y2,col,w){var r=rgb(col);doc.setDrawColor(r[0],r[1],r[2]);doc.setLineWidth(w||0.2);doc.line(x1,y1,x2,y2)}
  function wrapPDF(t,x,col,sz,bold,maxW,lh,padTop){
    doc.setFontSize(sz);doc.setFont('helvetica',bold?'bold':'normal');
    var lines=doc.splitTextToSize(t+'',maxW);
    lines.forEach(function(l){
      if(esCarta&&y>262){doc.addPage();y=20}
      txt(l,x,y+padTop,col,sz,bold);
      y+=lh;
    });
  }
  var hdrH=esCarta?32:16;
  fill(0,y,W,hdrH,'#ffffff');ln(0,y+hdrH,W,y+hdrH,navy,esCarta?1:0.5);
  var logoH=esCarta?20:10;
  var logoW=LOGO_DATA?(LOGO_W/LOGO_H)*logoH:logoH*4;
  if(LOGO_DATA){try{doc.addImage(LOGO_DATA,'PNG',M,y+(hdrH-logoH)/2,logoW,logoH)}catch(e){txt('TornoAuto',M,y+(esCarta?18:10),navy,fs.h1,true)}}
  else{txt('TornoAuto',M,y+(esCarta?18:10),navy,fs.h1,true)}
  
  txt(textoDocumentoMayus(),W-M,y+(esCarta?11:6),gray,fs.tiny,false,'right');
  txt('#'+c.folio,W-M,y+(esCarta?24:13),red,fs.h2,true,'right');
  y+=hdrH;
  var infoH=esCarta?26:12;
  fill(0,y,W,infoH,bg);ln(0,y+infoH,W,y+infoH,border);
  txt('CLIENTE',M,y+(esCarta?9:4.5),navy,fs.tiny,true);
  txt(c.cliente,M,y+(esCarta?18:9.5),'#1e2a3a',fs.body,true);
  ln(W/2,y,W/2,y+infoH,border);
  txt('MOTOR',W/2+(esCarta?10:4),y+(esCarta?9:4.5),navy,fs.tiny,true);
  doc.setFontSize(esCarta?fs.small:fs.tiny+1.5);doc.setFont('helvetica','normal');
  var motorLines=doc.splitTextToSize(c.motor,W/2-M-(esCarta?12:4));
  doc.setTextColor(hexRgb('#1e2a3a')[0],hexRgb('#1e2a3a')[1],hexRgb('#1e2a3a')[2]);
  doc.text(motorLines,W/2+(esCarta?10:4),y+(esCarta?16:9));
  y+=infoH+(esCarta?5:2.5);
  c.secciones.forEach(function(sec){
    if(esCarta&&y>250){doc.addPage();y=20}
    txt(sec.titulo.toUpperCase(),M,y+(esCarta?7:3.5),navy,fs.small,true);
    var tw=doc.getTextWidth(sec.titulo.toUpperCase());
    fill(M,y+(esCarta?9:4.5),tw+2,esCarta?1.5:0.7,red);
    y+=esCarta?16:7;
    if(sec.tipo==='repuestos'){
      sec.items.forEach(function(r){
        if(esCarta&&y>250){doc.addPage();y=20}
        var linea=((r.cantidad||1)>1?r.cantidad+'× ':'')+(r.repuesto||r.nr||'-');
        wrapPDF(linea,M,'#1e2a3a',fs.body,false,W-M*2-(esCarta?30:18),esCarta?6:3.5,esCarta?6:3.5);
        if(mostrar)txt(fmt(r.total||0),W-M,y-(esCarta?2:1.5),navy,fs.sub,true,'right');
        y+=esCarta?2:0.5;
        var det=[];
        if(r.medida)det.push('Med:'+r.medida);
        if(r.escadm)det.push('ESC/ADM:'+r.escadm);
        if(r.presentacion)det.push('Pres:'+r.presentacion);
        if(r.contiene)det.push('Cont:'+r.contiene);
        if(r.marca && r.marca!=='---')det.push('Marca:'+r.marca);
        if(r.nr && r.nr!==r.repuesto)det.push('NR:'+r.nr);
        if(det.length){
          wrapPDF(det.join(' · '),M+(esCarta?4:2),gray,fs.tiny+1,false,W-M*2-(esCarta?4:2),esCarta?5:2.5,esCarta?4:2.5);
        }
        if(r.comentario){
          wrapPDF('Nota: '+r.comentario,M+(esCarta?4:2),gray,fs.tiny+1,false,W-M*2-(esCarta?4:2),esCarta?5:2.5,esCarta?4:2.5);
        }
        ln(M,y+(esCarta?1:0.5),W-M,y+(esCarta?1:0.5),'#f3f4f7',0.1);
        y+=esCarta?4:2;
      });
    }else{
      sec.items.forEach(function(item){
        if(esCarta&&y>255){doc.addPage();y=20}
        wrapPDF(item.nombre||'',M,'#1e2a3a',fs.body,false,W-M*2-(esCarta?30:18),esCarta?6:3.5,esCarta?6:3.5);
        if(mostrar)txt(fmt(item.precio),W-M,y-(esCarta?2:1.5),navy,fs.sub,true,'right');
        y+=esCarta?4:1.5;
        var coment=(item.manejaCantidad?(item.cantidad||1)+'× ':'')+(item.comentario||'');
        if(coment){wrapPDF(coment,M,gray,fs.small,false,W-M*2,esCarta?6:3.2,esCarta?5:3)}
        if(item.actividades && item.actividades.length>0){
          item.actividades.forEach(function(a){
            if(esCarta&&y>260){doc.addPage();y=20}
            var nombreAct='• '+(a.actividad||'-');
            var actLines=doc.splitTextToSize(nombreAct,W-M*2-(esCarta?30:14));
            actLines.forEach(function(l,idx){
              if(esCarta&&y>262){doc.addPage();y=20}
              txt(l,M+(esCarta?4:1.5),y+(esCarta?5:3),navy,fs.small,false);
              if(idx===actLines.length-1 && a.medida){
                var offsetX=doc.getTextWidth(l);
                txt(a.medida,M+(esCarta?4:1.5)+offsetX+(esCarta?3:1),y+(esCarta?5:3),red,fs.small,true);
              }
              y+=esCarta?6:3;
            });
          });
          y+=esCarta?2:1;
        }
        ln(M,y,W-M,y,'#f3f4f7',0.1);y+=esCarta?4:1.5;
      });
    }
    ln(M,y,W-M,y,border,0.2);y+=esCarta?3:1.5;
    txt('Subtotal',W-M-(esCarta?50:32),y+(esCarta?6:3.5),gray,fs.small,false);
    txt(fmt(sec.subtotal),W-M,y+(esCarta?6:3.5),navy,fs.sub,true,'right');
    y+=esCarta?14:6;
  });
  var totH=esCarta?22:11;
  if(esCarta&&y>245){doc.addPage();y=20}
  fill(M,y,W-M*2,totH,navy);
  txt('TOTAL',M+(esCarta?12:5),y+totH*0.62,'#8899aa',fs.small,true);
  txt('Q '+c.total.toLocaleString('es-GT',{minimumFractionDigits:2}),W-M-(esCarta?10:4),y+totH*0.68,'#ffffff',fs.total,true,'right');
  y+=totH+(esCarta?8:3);
  var ntH=esCarta?16:8;
  fill(M,y,W-M*2,ntH,'#fdf0f2');fill(M,y,esCarta?3:2,ntH,red);
  txt('Anticipo: Se requiere 50% del total para iniciar trabajo.',M+(esCarta?12:5),y+ntH*0.62,'#1e2a3a',fs.small,false);
  y+=ntH+(esCarta?8:3);
  fill(0,y,W,esCarta?14:7,bg);
  
  var txtFoot = tipoDocumento === 'Cotizacion' ? 'Cotización válida por 15 días · TornoAuto' : 'Comprobante generado · TornoAuto';
  txt(txtFoot,W/2,y+(esCarta?9:4.5),gray,fs.tiny+1,false,'center');
  y+=(esCarta?14:7);
  return y;
}

function descargarPDF(tipo){
  var c=cotFiltrada();if(!c)return;
  precargarLogo(function(){
    var jsPDF=window.jspdf.jsPDF;
    var nombreArchivo = tipoDocumento === 'Cotizacion' ? 'Cotizacion' : 'Comprobante';
    if(tipo==='carta'){
      var doc=new jsPDF({unit:'mm',format:'letter'});
      dibujarPDF(doc,doc.internal.pageSize.getWidth(),c,preciosVisibles,true);
      doc.save(nombreArchivo+'_'+c.folio+'_carta.pdf');
    }else{
      var W=80;
      var tmp=new jsPDF({unit:'mm',format:[W,300]});
      var h=dibujarPDF(tmp,W,c,preciosVisibles,false);
      var doc2=new jsPDF({unit:'mm',format:[W,h+2]});
      dibujarPDF(doc2,W,c,preciosVisibles,false);
      doc2.save(nombreArchivo+'_'+c.folio+'_ticket.pdf');
    }
  });
}

function descargarImagen(){
  var c=cotFiltrada();if(!c)return;
  precargarLogo(function(){
    var logoImg=new Image();
    var dibujar=function(logoOk){
      var W=600,S=2,HMAX=5000;
      var canvas=document.createElement('canvas');canvas.width=W*S;canvas.height=HMAX*S;
      var ctx=canvas.getContext('2d');ctx.scale(S,S);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,HMAX);
      var navy='#1a3057',red='#c8102e',bg='#edf1f7',gray='#7a8899',border='#dde3ec';
      var M=24,y=0;
      var FS_ITEM=18, FS_PRICE=18, FS_SECT=18, FS_SUB=18, FS_DET=14;
      function fill(x,yy,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,yy,w,h)}
      function txt(t,x,yy,col,sz,bold,align){ctx.fillStyle=col;ctx.font=(bold?'bold ':'')+sz+'px -apple-system,system-ui,sans-serif';ctx.textAlign=align||'left';ctx.fillText(t+'',x,yy)}
      function ln(x1,y1,x2,y2,col,w){ctx.strokeStyle=col;ctx.lineWidth=w||0.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
      function wrapTxt(t,x,yTop,col,sz,bold,maxW,lh){
        ctx.font=(bold?'bold ':'')+sz+'px -apple-system,system-ui,sans-serif';ctx.fillStyle=col;ctx.textAlign='left';
        var words=String(t).split(' '),lines=[],line='';
        for(var i=0;i<words.length;i++){
          var test=line?line+' '+words[i]:words[i];
          if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=words[i]}else line=test;
        }
        if(line)lines.push(line);
        for(var j=0;j<lines.length;j++)ctx.fillText(lines[j],x,yTop+j*lh);
        return yTop+lines.length*lh;
      }
      var hdrH=100;
      fill(0,y,W,hdrH,'#ffffff');fill(0,y+hdrH-3,W,3,navy);
      if(logoOk){var logoH=60,logoW=(LOGO_W/LOGO_H)*logoH;ctx.drawImage(logoImg,M,y+(hdrH-logoH)/2,logoW,logoH)}
      else{txt('TornoAuto',M,y+55,navy,34,true)}
      
      txt(textoDocumentoMayus(),W-M,y+32,gray,13,false,'right');
      txt('#'+c.folio,W-M,y+68,red,32,true,'right');
      y+=hdrH;
      fill(0,y,W,60,bg);ln(0,y+60,W,y+60,border);
      txt('CLIENTE',M,y+20,navy,12,true);txt(c.cliente,M,y+44,'#1e2a3a',20,true);
      ln(W/2,y,W/2,y+60,border);
      txt('MOTOR',W/2+16,y+20,navy,12,true);txt(c.motor,W/2+16,y+44,'#1e2a3a',15,false);
      y+=75;
      c.secciones.forEach(function(sec){
        txt(sec.titulo.toUpperCase(),M,y+10,navy,FS_SECT,true);
        ctx.font='bold '+FS_SECT+'px -apple-system,system-ui,sans-serif';
        ctx.fillStyle=red;ctx.fillRect(M,y+15,ctx.measureText(sec.titulo.toUpperCase()).width+6,3);
        y+=28;
        if(sec.tipo==='repuestos'){
          sec.items.forEach(function(r){
            var linea=((r.cantidad||1)>1?r.cantidad+'× ':'')+(r.repuesto||r.nr||'-');
            var maxNombre=preciosVisibles?W-M-130:W-M*2;
            var yNombre=wrapTxt(linea,M,y+12,'#1e2a3a',FS_ITEM,false,maxNombre-M,22);
            if(preciosVisibles)txt(fmt(r.total||0),W-M,y+12,navy,FS_PRICE,true,'right');
            y=yNombre;
            var det=[];
            if(r.medida)det.push('Medida: '+r.medida);
            if(r.escadm)det.push('ESC/ADM: '+r.escadm);
            if(r.presentacion)det.push('Present: '+r.presentacion);
            if(r.contiene)det.push('Cont: '+r.contiene);
            if(r.marca && r.marca!=='---')det.push('Marca: '+r.marca);
            if(r.nr && r.nr!==r.repuesto)det.push('NR: '+r.nr);
            if(det.length){y=wrapTxt(det.join(' · '),M,y+12,gray,FS_DET,false,W-M*2,16)+2}
            if(r.comentario){y=wrapTxt('Nota: '+r.comentario,M,y+12,gray,FS_DET,false,W-M*2,16)+2}
            ln(M,y+2,W-M,y+2,'#f3f4f7',0.5);y+=12;
          });
        }else{
          sec.items.forEach(function(item){
            var maxNombre=preciosVisibles?W-M-130:W-M*2;
            var yNombre=wrapTxt(item.nombre||'',M,y+12,'#1e2a3a',FS_ITEM,false,maxNombre-M,22);
            if(preciosVisibles)txt(fmt(item.precio),W-M,y+12,navy,FS_PRICE,true,'right');
            y=yNombre;
            var coment=(item.manejaCantidad?(item.cantidad||1)+'× ':'')+(item.comentario||'');
            if(coment){y=wrapTxt(coment,M,y+10,gray,FS_DET,false,W-M*2,16)+2}
            if(item.actividades && item.actividades.length>0){
              var boxStartY=y;
              var rows=[];
              item.actividades.forEach(function(a){
                var nombreAct='• '+(a.actividad||'-');
                ctx.font='14px -apple-system,system-ui,sans-serif';
                var medW=a.medida?ctx.measureText(a.medida).width+20:0;
                var actLines=[];var words=nombreAct.split(' '),line='';var maxActW=W-M*2-20-medW;
                for(var i=0;i<words.length;i++){var t=line?line+' '+words[i]:words[i];if(ctx.measureText(t).width>maxActW&&line){actLines.push(line);line=words[i]}else line=t}
                if(line)actLines.push(line);
                rows.push({lines:actLines,medida:a.medida});
              });
              var totalRows=rows.reduce(function(a,r){return a+r.lines.length},0);
              fill(M,y,W-M*2,totalRows*24+10,'#f7f9fc');
              fill(M,y,3,totalRows*24+10,navy);
              y+=6;
              rows.forEach(function(rw){
                rw.lines.forEach(function(l,idx){
                  txt(l,M+10,y+12,'#1e2a3a',14,false);
                  if(idx===rw.lines.length-1 && rw.medida){
                    ctx.font='14px -apple-system,system-ui,sans-serif';
                    var wAct=ctx.measureText(l).width;
                    ctx.font='bold 13px -apple-system,system-ui,sans-serif';
                    var wMed=ctx.measureText(rw.medida).width;
                    var pillX=M+10+wAct+8,pillY=y+2,pillW=wMed+12,pillH=18;
                    ctx.fillStyle='#ffffff';ctx.strokeStyle=border;ctx.lineWidth=1;
                    if(ctx.roundRect){ctx.beginPath();ctx.roundRect(pillX,pillY,pillW,pillH,4);ctx.fill();ctx.stroke()}
                    else{ctx.fillRect(pillX,pillY,pillW,pillH);ctx.strokeRect(pillX,pillY,pillW,pillH)}
                    txt(rw.medida,pillX+6,y+15,red,13,true);
                  }
                  y+=24;
                });
              });
              y+=4;
            }
            ln(M,y+4,W-M,y+4,'#f3f4f7',0.5);y+=12;
          });
        }
        y+=8;ln(M,y,W-M,y,border,0.8);y+=22;
        txt('Subtotal',W-M-120,y,gray,14,false,'right');
        txt(fmt(sec.subtotal),W-M,y,navy,FS_SUB,true,'right');
        y+=26;
      });
      ctx.fillStyle=navy;
      if(ctx.roundRect){ctx.beginPath();ctx.roundRect(M,y,W-M*2,60,12);ctx.fill()}
      else{ctx.fillRect(M,y,W-M*2,60)}
      txt('TOTAL',M+20,y+36,'rgba(255,255,255,0.5)',14,true);
      txt('Q '+c.total.toLocaleString('es-GT',{minimumFractionDigits:2}),W-M-16,y+40,'#ffffff',30,true,'right');
      y+=75;
      fill(M,y,W-M*2,36,'#fdf0f2');fill(M,y,4,36,red);
      txt('Anticipo: Se requiere 50% del total para iniciar trabajo.',M+16,y+22,'#1e2a3a',14,false);
      y+=48;
      
      var txtFootImg = tipoDocumento === 'Cotizacion' ? 'Cotización válida por 15 días · TornoAuto' : 'Comprobante generado · TornoAuto';
      fill(0,y,W,26,bg);txt(txtFootImg,W/2,y+17,gray,13,false,'center');y+=26;
      
      var final=document.createElement('canvas');final.width=W*S;final.height=y*S;
      final.getContext('2d').drawImage(canvas,0,0);
      var link=document.createElement('a');
      var nombreArchivoImg = tipoDocumento === 'Cotizacion' ? 'Cotizacion' : 'Comprobante';
      link.download=nombreArchivoImg+'_'+c.folio+'.png';link.href=final.toDataURL('image/png');link.click();
    };
    if(LOGO_DATA){logoImg.onload=function(){dibujar(true)};logoImg.onerror=function(){dibujar(false)};logoImg.src=LOGO_DATA}
    else{dibujar(false)}
  });
}
</script>
